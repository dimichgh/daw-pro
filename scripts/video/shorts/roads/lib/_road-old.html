  const done = t - (ns[ns.length-1].t + ns[ns.length-1].dur);
  if (kn === k && done > 0) env *= Math.max(0, Math.exp(-done / 1.1));
  // ⛔ A VOICE THAT IS NOT PLAYING MUST NOT STAY LIT. env has a floor of 0.60,
  // so an idle voice sat at 60 % power parked on its last note.
  const gapNext = kn === k ? Infinity : ns[kn].t - ns[k].t;
  const noteEnd = ns[k].t + ns[k].dur;
  if (gapNext > (P.look.arcMaxGap ?? 0.9) && t > noteEnd) {
    const dec = Math.exp(-(t - noteEnd) / (P.look.idleFade ?? 0.45));
    // ⭐⭐ THE FADE DIMS; IT NO LONGER PUTS THE LIGHT OUT. A voice that has
    // already had a note stays lit through every rest — that is the round-15
    // rule, and this clamp is the whole of it.
    // ⭐⭐ THE FLOOR IS NOT PICKED, IT IS SOLVED — against the film's own strikes.
    // Moonlight's arpeggio already dips to 0.1227 between every pair of notes
    // (a level the user has watched for 36 s and never called invisible), and
    // striking out of THAT is the brightest ordinary strike in the film, 7.4x.
    // A rest floor BELOW it therefore makes the return from a rest a bigger jump
    // than any ordinary note — measured: at 0.10 the return read 9.4x against an
    // ordinary maximum of 7.4x, and reentry.mjs (R4) FAILED it. 0.13 sits just
    // above that dip, so the return IS an ordinary strike.
    // ⚠ AND IT IS 13x THE 0.01 LIVE THRESHOLD, so the light is never near going
    // out — against the 10,500x switch-on-in-place the observer measured from
    // darkness, which is what this whole clamp exists to remove.
    // ⭐ THE APPROVED TUNING SAMPLE CANNOT MOVE AT THIS VALUE, and that was
    // checked BEFORE the edit rather than discovered after it: its 11 fading gaps
    // bottom out at 0.4804, far above the clamp, so max() returns them unchanged.
    // ⚠ `idleFloor: 0` REPRODUCES THE OLD EXTINGUISHING FADE EXACTLY — it is a
    // control, not a dead knob (max(0, x) === x for x >= 0).
    // ⛔ THE LAST NOTE IS NOT A REST. gapNext is Infinity only when there is no
    // next note, i.e. the voice's part is OVER, and a part that has finished is
    // allowed to fade out — the `done` decay above owns the end of the film.
    // ⚠ IN A 90 s FILM THAT MEANS A VOICE FINISHING AT t=30 GOES OUT AT t=30.
    // Chosen, not assumed: "toward its next note" says nothing about a voice
    // that has no next note.
    if (kn !== k) env = Math.max(P.look.idleFloor ?? 0.13, env * dec);
    else env *= dec;
  }
  if (spawn) { x = spawn.x; y = spawn.y; z = spawn.z; env = spawn.env; }
  return { i: vi, road: rig.road, x, y, z, env, live: env > 0.01,
           spawning: !!spawn };
}

// ⭐ THE SCALING RUN'S INSTRUMENT. Object and pool counts, read from the LIVE
// scene rather than inferred from the payload — the whole point of the scaling
// question is whether something grows that nobody meant to grow, and a number
// derived from the payload cannot see that. Read-only; touches nothing.
window.__stats = function () {
  let objs = 0, geos = 0, verts = 0;
  scene.traverse(o => { objs++;
    if (o.geometry) { geos++;
      const pa = o.geometry.getAttribute && o.geometry.getAttribute('position');
      if (pa) verts += pa.count * (o.isInstancedMesh ? (o.count || 1) : 1); } });
  const vis = [];
  scene.traverse(o => { if (o.visible === false) return; if (o.isMesh) vis.push(o); });
  return { pool: strikePool.length, objects: objs, geometries: geos,
           vertices: verts, visibleMeshes: vis.length,
           sheetChildren: sheet ? sheet.children.length : -1,
           labels: labelMeshes.length,
           mem: (performance.memory && performance.memory.usedJSHeapSize) || -1 };
};

window.__perf = function (t) {
  const S = { t, voices: [], drums: [], strikes: [], arcs: [], comets: [], focusX: 0, focusZ: 0 };

  // ⭐ SHARE ONE LIGHT BUDGET ACROSS SOUNDING VOICES. Four independent lamps at
  // full power turned a four-note chord into a white sheet -- measured on the
  // 9.6 s still. Dividing by sqrt(n) keeps a single light as punchy as it was
  // and stops a chord from clipping.
  let nOn = 0;
  voiceRigs.forEach(rig => {
    const ns = rig.notes;
    if (ns.length && ns[0].t <= t + 1e-6 &&
        t <= ns[ns.length-1].t + ns[ns.length-1].dur + 1.1) nOn++;
  });
  S.share = 1 / Math.sqrt(Math.max(1, nOn));

  voiceRigs.forEach((rig, vi) => {
    const ns = rig.notes;
    const bp = ballAt(vi, t);
    S.voices.push(bp);

    // ---- THE COMET, sampled backwards along the ball's OWN path -----------
    // ⛔⛔ THE OLD TRAIL WAS A CHAIN OF PER-NOTE ARCS AND IT COULD NOT BE WHAT
    // THE USER ASKED FOR. Their words: "they need to be like comets out with
    // thick tails coming out of disk (disk size) and narrowing to the end of
    // the tail and there is no end of the tail, lines."
    // Three properties, and the arc chain failed all three:
    //   - WIDTH AT THE HEAD = THE DISK'S OWN DIAMETER. arcR was a fixed 0.011,
    //     unrelated to playR, so the tail was a thread leaving a disk.
    //   - MONOTONE NARROWING. Every arc JOIN restarted the taper at full width,
    //     so the trail was a string of tapered sausages, not one comet.
    //   - NO END. The oldest ribbon was retired by arcHistory at fade 0.181
    //     (melody) / 0.290 (bass) -- a terminating stub at 18-29 % brightness.
    //     ⚠ RAISING arcHistory DOES NOT FIX THIS, it moves the stub further
    //     back; the tail has to REACH zero width and zero alpha on its own.
    // Sampling ballAt backwards gives all three by construction: one strip,
    // width and alpha are functions of AGE alone, and both hit exactly 0 at
    // maxAge, so the geometry ends where it is already invisible.
    {
      // ⛔⛔⛔ ROUND 7 BLOCKER 1 -- THE COMET WAS DRAWING THE SPAWN ARC.
      // In every r9 cut, two thick cream tubes hang in the BLACK SKY above the
      // road in the t=7.5-8.4 s window, detached from everything and ending in
      // a flat chamfered cap. They are this ribbon, faithfully tracing the
      // ball's fly-in arc up out of the frame.
      // ⭐ THE COMET IS THE RECORD OF A PLAYHEAD TRAVELLING THE ROAD, NOT OF IT
      // ARRIVING AT THE ROAD. So: no ribbon at all while the voice is spawning,
      // and the sample window is clamped so it can never reach back past the
      // voice's FIRST LANDING however long cometAge is.
      // ⚠ Shortening the tail would NOT have fixed this -- it would have left a
      // shorter tube in the same empty sky.
      const maxAgeCfg = P.look.cometAge ?? 1.15;
      const t0v = (P.voices[vi] && P.voices[vi].notes && P.voices[vi].notes.length)
                ? P.voices[vi].notes[0].t : -1e9;
      // ⛔⛔⛔ THIS CLAMP WAS THE "NO TAILS ON THE FLY-IN" DEFECT, AND IT
      // SURVIVED THE FIX THAT WAS SUPPOSED TO REMOVE IT. Round 7's sky-tube fix
      // had TWO parts: (1) no ribbon while spawning, (2) clamp the sample window
      // to the voice's FIRST LANDING. Round 11 reverted (1) and left (2) — and
      // with (2) in place `t - t0v` is NEGATIVE for the whole approach, so
      // maxAge collapsed to 1e-6 and there was nothing to draw until the ball
      // bounced. The user saw exactly that, twice: "still has no tails when they
      // fly in, then once they bounce they got the tails."
      // ⭐ THE SYMPTOM NAMED THE CAUSE — the tail appearing precisely AT the
      // first bounce is what a first-landing clamp looks like from the outside.
      // ⭐ The window now reaches back to the SPAWN START (t0v - spawnLead), so
      // the trail exists for the whole visible approach.
      // ⚠ SAFE ONLY BECAUSE OF TWO OTHER PROPERTIES, both load-bearing: the
      // spawn path now runs ALONG the lane (round 10) rather than arcing into
      // the sky, and the taper is index-clamped so a newborn ribbon reaches
      // exactly zero width at its oldest sample. entry.mjs (G) is the
      // WORLD-SPACE guard that holds both honest.
      const leadV = P.look.spawnLead ?? 0.75;
      // ⚠ `cometClampToLanding` RESTORES THE BUG ON PURPOSE: it is (G2)'s control.
      const maxAge = P.look.cometClampToLanding === true
                   ? Math.max(1e-6, Math.min(maxAgeCfg, t - t0v))
                   : Math.max(1e-6, Math.min(maxAgeCfg, t - (t0v - leadV)));
      const N = P.look.cometSegs ?? 44;
      const pts = [];
      // ⛔⛔ ROUND 7 BLOCKER 2 -- DUPLICATE POINTS KILLED THE WHOLE RIBBON.
      // Comet contribution went to EXACTLY ZERO pixels at t=11.100 in all ten
      // r9 cuts -- a one-frame disappearance, not a retraction, worth a 14-30
      // luma step in the whole-frame mean. The balls park at t=11.018, so from
      // then on ballAt returns the SAME position for successive ages; the
      // duplicate-point count runs 0 / 1 / 3 / 37 at t = 11.033 / 11.067 /
      // 11.100 / 12.000. A CatmullRomCurve3 through coincident points has no
      // defined tangent, and TubeGeometry emits NaN vertices -- the mesh exists,
      // the state looks perfect, and nothing draws.
      // ⭐ Dropping coincident samples fixes it AND gives the behaviour that was
      // wanted anyway: as the ball parks the distinct samples collapse toward
      // one, so the ribbon RETRACTS over cometAge instead of blinking out.
      const MINSEP = 1e-4;
      for (let q = 0; q <= N; q++) {
        const age = (q / N) * maxAge;
        const bb = ballAt(vi, t - age);
        if (!bb || bb.live === false || bb.x === undefined) break;
        const v3 = new THREE.Vector3(bb.x, bb.y, bb.z);
        if (pts.length && v3.distanceTo(pts[pts.length - 1].p) < MINSEP) continue;
        pts.push({ p: v3, age });
      }
      // ⛔⛔ THE COMET MUST FADE IN WITH ITS BALL. Caught by the new entry gate
      // on the first run after the comet landed: voice 3's pop-step went from
      // 3511 back up to 18793, because the ball's env was correctly ramping
      // from zero while its TAIL was drawn at full brightness from the first
      // frame. That is the entry pop again, in a new place -- the same shape as
      // the original defect (a brightness that ignores env), which is exactly
      // why the gate is a pixel gate and not a state gate.
      // ⚠ THE TAIL COMES UP AHEAD OF THE BALL, ON PURPOSE. With a linear envK
      // the ball and its comet crossed the visibility threshold in the SAME
      // frame and the two areas appeared together -- voice 3's pop-step went to
      // 18199 px, close to the --nofade control's own 23405. A gentler exponent
      // lifts the tail out of the dark first, so the entry reads as something
      // arriving rather than switching on.
      const envK = Math.pow(Math.min(1, (bp.env ?? 1) / (P.look.glowRef ?? 0.55)),
                            P.look.cometEnvPow ?? 0.55);
      // ⭐⭐ ROUND 11: THE TAIL IS BACK ON THE FLY-IN, and the condition that
      // made suppression necessary no longer holds. Round 7 suppressed the
      // ribbon while spawning because it was tracing the fly-in arc UP INTO THE
      // SKY and ending in a flat full-width octagonal cap. Round 10 moved the
      // spawn so the ball arrives from far up the road ALONG the lane, so a
      // trail behind it runs along the road and cannot rise into the sky; and
      // the taper is now u = max(age/maxAge, i/N), so width and alpha reach
      // EXACTLY ZERO at the ribbon oldest sample whatever its age -- a newborn
      // ribbon cannot present a full-width end in any take.
      // ⚠ BOTH of those are load-bearing. If either is undone this defect comes
      // straight back, which is why entry.mjs (F) now measures the SKY BOX that
      // caught it: x>1305,y<302 read 104,596 px in r9 and must stay at 0.
      if (pts.length >= 3 && envK > 0.001)
        S.comets.push({ vi, road: rig.road, pts, maxAge, envK });
    }
  });

  // ---- percussion: FALL, strike, bounce back up, vanish -------------------
  // ⭐⭐ THIS IS THE WANTED BEHAVIOUR, NOT AN UNFIXED ONE. The user: "drums/kick
  // are pefect!". The observer measured it (straight down, world x and z
  // constant, strike at y=0.05, bounce to ~0.25, gone by +0.75 s) and filed it
  // as a defect; it is not one. Do not "fix" it, and do not fold it into the
  // spawn contract above -- that is for the PITCHED voices only.
  // ---- percussion: WAIT IN THE HOLE, LEAP OUT ON THE BEAT, FALL BACK IN ----
  // ⛔⛔ REVERSED FROM ROUND 5, ON THE USER'S OWN WORDS: "drums should be holes
  // and light disks should jump out of them on beat." Round 5 recorded the
  // straight-down fall as WANTED (their earlier "drums/kick are pefect!") and
  // instructed the next observer not to re-file it. That record is SUPERSEDED,
  // not correct. The road now has a real opening at every hit (see __init) and
  // the disk lives below it until its beat.
  const G = P.drumGravity;
  const HD = P.look.holeDepth ?? 0.42;
  drumRigs.forEach((r, di) => {
    const rel = t - r.d.t;
    if (rel < -0.55 || rel > 0.95) { S.drums.push({ i: di, road: r.road, live: false }); return; }
    let y, al;
    if (rel < 0) {
      // waiting, down in the hole: a faint ember visible THROUGH the opening,
      // so the hole is not a dead black circle between hits
      y = -HD * (P.look.drumRestK ?? 0.55);
      al = (P.look.drumRestGlow ?? 0.22) * Math.min(1, (rel + 0.55) / 0.30);
    } else {
      // the leap. Unclamped on the way down ON PURPOSE: the parabola carries it
      // back below y=0 and it disappears into the hole it came out of, which is
      // what makes the opening read as the thing it came from.
      const v0 = (P.look.drumLeap ?? 0.72) * G * (0.45 + 0.55 * r.d.vel);
      y = v0 * rel - 0.5 * G * rel * rel;
      al = Math.exp(-rel / (P.look.drumFade ?? 0.34));
    }
    const k = (rel >= 0 ? 1.6 : 0.7) * al * (0.5 + 0.5 * r.d.vel);
    S.drums.push({ i: di, road: r.road, live: k > 0.004,
                   x: r.d.lane, y, z: -r.d.t * P.zps, k, below: y < 0 });
  });

  // ---- TERM 2: RESIDUAL EMISSION -- the struck note's OWN glow -------------
  // TERM 1 is ILLUMINATION: the moving disk is a real PointLight, it falls off
  // with distance, it sums across voices, it vanishes when the disk leaves.
  // TERM 2 is this: the note's own emissive, triggered at the strike, decaying
  // on its own clock, owing nothing to where the disk went. It is why the road
  // BEHIND the playhead reads as recently-played music instead of darkness.
  // ⚠ NEVER BUY TERM 2 BY INFLATING TERM 1. Widening lightDist to make old
  // notes glow lights the whole sheet and undoes the lit-fraction work.
  {
    const tau = P.look.afterDecay ?? 1.6;
    const fl = P.look.afterFlash ?? 0.0, flTau = P.look.afterFlashTau ?? 0.10;
    // ⭐⭐ WINDOWED, AND THE WINDOW IS DERIVED FROM THE DECAY ITSELF. This loop
    // walked EVERY note in the film on EVERY frame and then sorted them — the
    // second half of the O(N^2). But `a` is a sum of two DECAYING exponentials,
    // so it is monotone in age: a note is above `afterCut` if and only if it is
    // younger than a fixed window, and that window does not grow with the film.
    //     a(age) = exp(-age/tau) + fl*exp(-age/flTau) <= (1+fl)*exp(-age/tau)
    // so age > tau*ln((1+fl)/cut) guarantees a <= cut. Conservative by
    // construction (the flash term only ever ADDS), so the set this produces is
    // EXACTLY the set the full walk produced — nothing is dropped that was lit.
    // ⚠ afterFloor > 0 means every note stays lit forever by design; then there
    // is no window and the full walk is the correct behaviour. Kept.
    const AGEMAX = (P.look.afterFloor ?? 0) > 0 ? Infinity
                 : tau * Math.log((1 + fl) / Math.max(1e-9, P.look.afterCut ?? 0.004));
    const lit = [];
    for (const v of P.voices) {
    // ⚠ ITERATION ORDER IS PRESERVED — voice by voice, note by note, exactly as
    // the full walk did — because the sort below is only stable-equal to the old
    // one if the input order of the surviving elements is the same.
    for (let ni = 0; ni < v.notes.length; ni++) {
      const n = v.notes[ni];
      if (n.t > t + 1e-6) continue;
      if (P.look.onlyRoad != null && (v.road ?? 0) !== P.look.onlyRoad) continue;
      const a = Math.exp(-(t - n.t) / tau) + fl * Math.exp(-(t - n.t) / flTau);
      // ⚠ the cutoff at which a disk leaves the pool. It must be low enough
      // that the disk it uncovers -- an identical unstruck head -- is
      // indistinguishable, or the census itself becomes a visible snap.
      if (a > (P.look.afterCut ?? 0.004) || (P.look.afterFloor ?? 0) > 0) lit.push({ x: n.x, z: -n.t * P.zps, a });
    } }
    lit.sort((p, q) => q.a - p.a);
    S.strikes = lit.slice(0, strikePool.length);
  }

  // the focus point the CAMERA may read -- the brightest live playhead
  let best = null;
  for (const v of S.voices) if (v.live && (!best || v.env > best.env)) best = v;
  if (best) { S.focusX = best.x; S.focusZ = best.z; }
  return S;
};

// ⭐ CAMERA TAKES ARE DATA. P.takes maps a name to either an array of framing
// keyframes (the original shape) or {kind:'approach', ...}. P.take names the
// active one and defaults to 'default', so nothing regresses.
window.__camera = function (t, S) {
  // camera road position: the road IS the timeline (z = -t*zps), so a camera
  // that advances LINEARLY IN t moves at exactly constant speed and always sits
  // on the sounding position. It must COAST TO A STOP when the music does --
  // with tc = t flat the camera kept driving into blank road (measured on the
  // 12.90 s still). This decays the SPEED, so value and velocity are both
  // continuous at the last onset and there is no lurch.
  // ⚠⚠ THE CLOCK COMES FROM THE PAYLOAD, NOT FROM P.voices -- an isolation
  // render that removes voices must not also move the camera.
  const uniq = (P.onsets && P.onsets.length)
    ? P.onsets
    : (() => { const o = P.voices.flatMap(v => v.notes.map(n => n.t)).sort((a,b)=>a-b);
               return o.filter((v,i) => i === 0 || v - o[i-1] > 1e-4); })();
  let gi = 0; for (let k = 0; k < uniq.length; k++) if (uniq[k] <= t + 1e-6) gi = k;
  const mx = new Map();
  for (const v of P.voices) for (const n of v.notes) {
    const key = Math.round(n.t * 1e4);
    const e = mx.get(key) || { s: 0, c: 0 }; e.s += n.x; e.c++; mx.set(key, e);
  }
  const tLast = uniq[uniq.length - 1];
  const coast = P.look.coastTau ?? 0.8;
  const tc = t <= tLast ? t : tLast + coast * (1 - Math.exp(-(t - tLast) / coast));
  const zc = -tc * P.zps;

  const takeName = P.look.take ?? P.take ?? 'default';
  const take = (P.takes && P.takes[takeName]) || null;

  takeCull = (take && take.cullNear != null) ? take.cullNear : null;

  // ⭐⭐⭐ THE SIDE-CROSSING TAKE (round 7). The user: "a variant with camera
  // view tracking playheads on the side, going with them and then fly over to
  // the other side and tracking from there".
  // The camera rides ALONGSIDE the tracked playhead at road level, then arcs
  // OVER the road to the opposite side and keeps riding. It is one continuous
  // move, not a cut, because the crossing is a single smoothstep in t.
  // ⭐ IT CANNOT LOSE THE SUBJECT, BY CONSTRUCTION: the position tracks the
  // smoothed playhead z and the camera LOOKS AT that playhead every frame. The
  // fixed-rate recede that framing.mjs fails at 75.9 % had neither property.
  // ⭐ AND IT IS STILL A PURE FUNCTION OF t -- trackZ/trackX are sampled and
  // box-filtered ONCE at init, so a cold __frame(9.4) equals the same instant
  // reached by playing from 0, and perfcam/stills-equal-sequence survive.
  // ⚠ THE CROSSING MOMENT IS NOT GUESSED. Measured off this payload: the
  // largest inter-onset gap in the piece is 1.000 s and it begins at t=8.0175,
  // which is also a HEAVY bar line (P.bars[4]). So the move starts on a phrase
  // boundary and spends its whole length in the sparsest passage, never
  // mid-flurry.
  // ⭐⭐⭐ SEGMENTED CAMERA TRACK — the prototype for the long piece.
  // The user asked for the fly-over to LAND somewhere different: "maybe as it
  // flies over it should not take the same side position and maybe move a little
  // behind like in short." A mirror-image crossing ends where it began; a
  // JOURNEY ends in a different KIND of shot.
  // ⭐ SO THE TAKE IS A LIST OF TYPED SHOTS, NOT A BESPOKE MOVE. Each shot type
  // is a pure function (t) -> POSE {pos, aim, fov}; the track BLENDS POSES with
  // a smoothstep across a transition window. Adding a shot type is adding one
  // case; adding a segment is adding one array entry. That is the data model the
  // choreographed long track needs, and this take is its working test.
  // ⚠ POSES, NOT PARAMETERS. Interpolating h/pitch/yaw between two different
  // shot TYPES is meaningless -- they do not parameterise the same way. Position
  // and aim point are the common currency, and lerping them is a real camera
  // move.
  // ⚠ STILL A PURE FUNCTION OF t: trackZ/trackX are sampled and box-filtered
  // once at init, and the blend reads only t. perfcam and stills-equal-sequence
  // both survive, which is the whole reason the split exists.
  if (take && (take.kind === 'side' || take.kind === 'seq')) {
    const fz = trackAt(trackZ, t), fx = trackAt(trackX, t);
    const segs = take.segments || [
      // ⭐ ROUND 11: the START pose reads look-level overrides so it can be
      // laddered without a take per rung. LAND is untouched by design.
      { type: 'side',    side: (take.startSide ?? 1) * (P.look.sideDist ?? take.side ?? 4.2),
                         h: P.look.sideH ?? take.h ?? 1.23,
        // ⭐ ROUND 11b: `lead` is the START pose's +z offset -- how far BEHIND the
        // playheads it sits. User: "kind of the same position like in shorts but
        // to the right side". The Short's camera sits back 4.35; the side take
        // sat at +0.35. So the Short is the UPPER bound and the old side the
        // LOWER, and sideBack lands between them. Aim is unchanged and already
        // tracks (fx, fz - aimAhead), so lateral position and aim move TOGETHER
        // by construction -- the roadpix failure cannot recur here.
        lead: P.look.sideBack ?? take.lead ?? 0.35,
        aimAhead: P.look.sideAhead ?? take.aimAhead ?? 1.4, fov: P.look.sideFov ?? take.fov ?? 58 },
      // ⭐ THE LANDING SHOT: three-quarter, off to the LEFT and a little BEHIND.
      // "Behind" is +z, because the flow is toward -z -- so the playheads sit in
      // the forward part of the frame with road visible ahead of them, which is
      // what the user asked for and what the Short's camera does.
      // ⚠ NOT a chase view: qx keeps real lateral offset so the side character
      // that made the take interesting survives the landing.
      { type: 'quarter', qx: take.qx ?? -2.35, h: take.qh ?? 1.55,
        back: take.qback ?? 2.6, aimAhead: take.qAhead ?? 2.2, fov: take.qfov ?? 52 }
    ];
    const pose = (sg) => {
      if (sg.type === 'quarter') {
        return { pos: new THREE.Vector3(sg.qx, sg.h, fz + sg.back),
                 aim: new THREE.Vector3(fx * (take.followX ?? 1.0), take.aimY ?? 0.06, fz - sg.aimAhead),
                 fov: sg.fov };
      }
      return { pos: new THREE.Vector3(sg.side, sg.h, fz + sg.lead),
               aim: new THREE.Vector3(fx * (take.followX ?? 1.0), take.aimY ?? 0.06, fz - sg.aimAhead),
               fov: sg.fov };
    };
    // ⚠ THE TRANSITION MOMENT IS MEASURED, NOT CHOSEN: t=8.0175 is the largest
    // inter-onset gap in this piece (1.000 s) and a heavy bar line. The long
    // track must place every transition the same way.
    const c0 = take.crossT ?? 8.0175, cd = take.crossDur ?? 1.6;
    const u  = Math.min(1, Math.max(0, (t - c0) / cd));
    const e  = u * u * (3 - 2 * u);          // smoothstep: value and slope continuous
    const A = pose(segs[0]), B = pose(segs[Math.min(1, segs.length - 1)]);
    const pos = A.pos.clone().lerp(B.pos, e);
    const aim = A.aim.clone().lerp(B.aim, e);
    // it FLIES OVER rather than sliding across: the lift peaks at the halfway
    // point, where the camera is over the centre of the road.
    pos.y += (take.crossLift ?? 2.10) * Math.sin(Math.PI * e);
    cam.fov = A.fov + (B.fov - A.fov) * e; cam.updateProjectionMatrix();
    cam.position.copy(pos);
    cam.lookAt(aim);
    return;
  }

  if (take && take.kind === 'approach') {
    // ⭐⭐ THE REVERSE ANGLE. The user: "even go in front and show how the
    // playing disks approach as we move camera back." The camera sits AHEAD of
    // the playhead on the road, faces back down it, and retreats.
    // ⚠ THE RETREAT RATE IS THE WHOLE SHOT, so it is a payload number and not a
    // constant: at rate == zps the gap is fixed and the frame is static and
    // dead; below zps the disks close on the lens, grow, and eventually pass
    // it. Which of those reads better is the user's call, so it is laddered.
    // ⭐ TRACKING, when the take asks for it. Instead of receding at a fixed
    // rate and hoping, the camera sits a fixed GAP ahead of the SMOOTHED
    // playhead position -- so the subject cannot outrun it, whatever the music
    // does. The old fixed-rate form is kept below and is the gate's control:
    // it is the thing that was measured leaving frame.
    let camZ, camX;
    if (take.track) {
      const fz = trackAt(trackZ, t), fx = trackAt(trackX, t);
      const gap = take.gap ?? 1.9;
      camZ = fz - gap;
      camX = (take.x ?? 0) + fx * (take.followX ?? 0.35);
    } else {
      const rate = take.rate ?? (P.zps * 0.72);
      const g0 = take.gap0 ?? 2.6;
      const gap = Math.max(take.gapMin ?? 0.55, g0 - (P.zps - rate) * t);
      camZ = zc - gap;
      camX = (take.x ?? 0) + (S ? S.focusX * (take.followX ?? 0.35) : 0);
    }
    cam.fov = take.fov ?? 46; cam.updateProjectionMatrix();
    cam.position.set(camX, take.h ?? 1.30, camZ);
    const pr = (take.pitch ?? -13) * Math.PI / 180;
    // facing BACK down the road: +z
    const dir = new THREE.Vector3(Math.sin((take.yaw ?? 0) * Math.PI / 180),
                                  Math.sin(pr), Math.cos(pr));
    cam.lookAt(cam.position.clone().addScaledVector(dir, 4.0));
    return;
  }

  // ---- the default, following take ----------------------------------------
  // ⭐ FOLLOW THE LIGHT SIDEWAYS TOO. Pitch maps to lateral X on a rotated
  // staff, so with the camera pinned at x=0 a high note in the near field walks
  // out of the right-hand edge.
  // ⚠ A PURE FUNCTION OF t, NOT AN EXPONENTIAL SMOOTHER. A smoother carries
  // state from the previous frame, so __frame(6.60) called cold would not equal
  // __frame(6.60) reached by playing from 0 -- stills mode and the film would
  // disagree and only one of them is checked.
  const xAt = q => { const e = mx.get(Math.round(q * 1e4)); return e ? e.s / e.c : 0; };
  let fx;
  if (gi < uniq.length - 1) {
    const a = xAt(uniq[gi]), b = xAt(uniq[gi+1]);
    const u = Math.min(1, Math.max(0, (t - uniq[gi]) / (uniq[gi+1] - uniq[gi])));
    fx = a + (b - a) * (u * u * (3 - 2 * u));
  } else fx = xAt(uniq[gi] ?? 0);
  fx *= (P.look.camFollowX ?? 0.60);
  camAt(t, zc, fx, Array.isArray(take) ? take : P.camera);
};

window.__frame = function (t) {
  try {
    const S = window.__perf(t);
    window.__camera(t, S);

    // ================= APPLY. Everything below may read the lens. ===========
    let lightScreenY = 0.30;
    const only = P.look.onlyRoad;
    S.voices.forEach(v => {
      const rig = voiceRigs[v.i];
      if (!v.live) { rig.grp.visible = false; return; }
      // ⚠ A HARD CULL, and it is CAMERA-DEPENDENT ON PURPOSE -- which is why it
      // lives here and not in __perf. A light still fading when the camera
      // reaches it fills the frame on the way through.
      // ⛔⛔ THIS CULL WAS FORWARD-CAMERA-ONLY AND IT EMPTIED THE REVERSE ANGLE.
      // It used to read `cam.position.z - v.z < cullNear`. With the camera
      // AHEAD on the road and facing back, cam.z - v.z is about MINUS the gap
      // -- always negative, always under the threshold -- so EVERY playhead rig
      // was culled on EVERY frame of the approach take: no disk, no point
      // light, no halo. The white disks in that take's frames were the struck
      // note pool, not playheads, and the "72-76 % lit, flat and even" reading
      // was not a property of the angle at all: with no rigs there is nothing
      // but overhead and ambient.
      // ⚠⚠ AND perfcam CANNOT SEE THIS. The performance state was identical
      // under both takes -- correctly -- because the bug is in APPLY, which is
      // camera-dependent by design. A gate that proves two layers are separate
      // says nothing about whether the second layer is right.
      // Depth along the VIEW DIRECTION is the frame-independent form.
      const fwd = cam.getWorldDirection(new THREE.Vector3());
      const depth = new THREE.Vector3(v.x, v.y, v.z).sub(cam.position).dot(fwd);
      const near = depth < (takeCull ?? P.look.cullNear ?? 1.2);
      rig.grp.visible = !near && (only == null || rig.road === only);
      rig.grp.position.set(v.x, v.y, v.z);
      rig.light.intensity = (P.look.lightPower ?? 0.30) * v.env * S.share;
      // scale the DISK about its own proportions -- setScalar would fatten it
      // into a puck on the landing flare.
      { const b = rig.core.userData.base, kk = 0.85 + 0.5 * v.env;
        rig.core.scale.set(b.x * kk, b.y * (0.9 + 0.25 * v.env), b.z * kk); }
      // ⭐ BRIGHTNESS, the half that was missing. `glowRef` is the env at which
      // the core reaches its full colour; above it nothing changes, so the
      // established look of a PLAYING voice (env 0.60-1.15) is untouched and
      // only the entry ramp and the ending decay move. Set glowRef to 0 to get
      // the old always-full behaviour back -- that is the gate's control.
      { const gr = P.look.glowRef ?? 0.55;
        const g = gr <= 0 ? 1 : Math.min(1, Math.max(0, v.env / gr));
        rig.core.material.color.copy(rig.core.userData.col)
          .multiplyScalar(Math.pow(g, P.look.glowGamma ?? 1.0)); }
      rig.halo.material.opacity = Math.min(1, v.env);
      rig.halo2.material.opacity = Math.min(1, 0.75 * v.env);
      const q = new THREE.Vector3(v.x, v.y, v.z).project(cam);
      if (q.z < 1) lightScreenY = Math.min(lightScreenY, (q.y + 1) / 2);
    });
    grade.uniforms.uLightY.value = lightScreenY;

    // ---- arcs: rebuilt from scratch every frame ----------------------------
    // ⭐ THE USER'S "you re-draw pictures" HYPOTHESIS, SETTLED: nothing
    // accumulates. Every arc mesh is disposed and rebuilt here, so a trail that
    // does not fade is a GRADIENT problem, not a build-up one -- and it was:
    // round 4 set arcTailGain 0.55 with falloff 1.2, very nearly a ribbon of
    // even brightness end to end.
    while (arcGroup.children.length) {
      const m = arcGroup.children.pop();
      m.geometry.dispose(); m.material.dispose();
    }
    // ⭐ ONE STRIP PER VOICE, built from the sampled path. Width at the head is
    // the PLAYHEAD DISK'S OWN DIAMETER, exactly as asked, and both width and
    // alpha fall monotonically to zero at maxAge -- so the strip's last
    // vertices are zero-width and fully transparent and there is nothing to
    // see an end of.
    for (const c of S.comets) {
      if (only != null && c.road !== only) continue;
      const m = cometFor(c, voiceRigs[c.vi].tint);
      if (m) arcGroup.add(m);
    }

    S.drums.forEach(d => {
      const r = drumRigs[d.i];
      if (!d.live) { r.grp.visible = false; return; }
      r.grp.visible = (only == null || r.road === only);
      r.grp.position.set(d.x, d.y, d.z);
      r.light.intensity = (P.look.drumPower ?? 0.7) * d.k;
      r.halo.material.opacity = Math.min(1, d.k);
      // ⛔ setScalar WAS CORRECT ONLY WHILE THE CORE WAS A SPHERE OF RADIUS
      // drumCoreR -- the radius was baked into the geometry. The core is now a
      // UNIT cylinder scaled by userData.base, so setScalar(0.6..1.5) made it a
      // one-and-a-half WORLD UNIT disk and the right half of the frame went
      // white. This is the second time in this round that swapping a geometry
      // silently changed what an existing scale call meant (see the ledger
      // lines); it is worth treating as a pattern rather than two accidents.
      { const b = r.core.userData.base, kk = 0.6 + 0.9 * d.k;
        r.core.scale.set(b.x * kk, b.y * kk, b.z * kk); }
    });

    // ---- the note's own circle lights up -----------------------------------
    // user: "the circle of the note should glow, not just part of some cloud
    // covering the note". This is that circle: a disk of the same geometry as
    // the sheet's notehead, a hair proud of it so it wins the depth test,
    // emissive through the bloom pass rather than a billboard hovering above.
    const DH = P.look.noteH ?? 0.026;
    for (let i = 0; i < strikePool.length; i++) {
      const m = strikePool[i];
      if (i >= S.strikes.length) { m.visible = false; continue; }
      const st = S.strikes[i];
      m.visible = true;
      // ⚠ EXACTLY THE HEAD'S SCALE, not 1.04x. The old 4 % oversize was the
      // other half of "it never goes back to black": even at zero emissive the
      // struck disk was visibly bigger than its neighbours forever.
      m.position.set(st.x, DH / 2 + Z_EPS * 1.7, st.z);
      m.scale.set(P.NOTE_R * 0.74, DH, P.NOTE_R);
      // ⭐⭐ BLACKBODY COOLING. The user: "the note disks should decay into red
      // like metal getting cooled." So the decay is a COLOUR ramp, not only an
      // intensity ramp: white-hot, yellow, orange, deep red, out.
      // ⚠ THIS IS THE NOTE DISKS ONLY. The user did not ask for it on the
      // playhead disks and those are deliberately left on their existing
      // neutral-core look.
      // ⭐ IT REACHES EXACTLY BLACK BY CONSTRUCTION: the ramp's colour is a
      // direction and the INTENSITY is proportional to a, so a -> 0 gives
      // emissive 0 whatever the hue is. A deep-red floor would be the same
      // defect as the pale floor it replaces, in a different colour.
      const a = st.a;
      const cool = (u) => {                       // u = 1 hot .. 0 out
        const stops = [[0.00, 0.55, 0.00, 0.00],  // barely-there ember
                       [0.18, 1.00, 0.06, 0.00],  // deep red
                       [0.40, 1.00, 0.32, 0.04],  // orange
                       [0.68, 1.00, 0.72, 0.26],  // yellow
                       [1.00, 1.00, 0.97, 0.90]]; // white-hot
        let i = 0; while (i < stops.length - 2 && u > stops[i+1][0]) i++;
        const A = stops[i], B = stops[i+1];
        const f = Math.min(1, Math.max(0, (u - A[0]) / (B[0] - A[0])));
        return new THREE.Color(A[1] + (B[1]-A[1])*f, A[2] + (B[2]-A[2])*f, A[3] + (B[3]-A[3])*f);
      };
      m.material.emissive.copy(cool(Math.min(1, a)));
      m.material.emissiveIntensity =
        Math.min(8, (a + (P.look.afterFloor ?? 0)) * (P.look.afterGain ?? 0.85) * (P.look.strikeEmissive ?? 2.8));
    }

    // ---- labels must read from WHICHEVER SIDE the camera is on -------------
    // ⚠ A flat label on the paper reads correctly from one side and MIRRORED
    // from the other, and the reverse-angle take looks at it from the other.
    // Flipping it about its own normal is presentation, not performance, so it
    // belongs here. ⛔ THE ORIENTATION IS NOT ASSERTED ANYWHERE -- it is read
    // off a rendered frame, in both takes, by cropping and looking. Three
    // rounds in a row have had it wrong while the code looked right.
    // ⚠ ROUND 7: the side-crossing take sits AT the playhead's z, so this test
  // flips every label the camera draws level with -- a mid-shot flicker down
  // the whole road. `labelFlip:false` freezes it for that take; the result is
  // read off a frame, like every other orientation claim here.
  // ⭐ ROUND 7, MEASURED ON FRAMES: freezing it was WRONG. The side take starts
  // at x=-2.7 where the z-test happens to read correctly, crosses to x=+2.7,
  // and every label came back MIRRORED for the rest of the shot (seen at
  // t=9.60 and t=11.00). For a camera that crosses the road, the side it is on
  // is what decides legibility, so `labelFlip:"x"` tests x instead of z.
  const lf = P.look.labelFlip;
  if (lf === false) { for (const m of labelMeshes) m.rotation.z = 0; }
  // ⚠⚠ ROUND 8: THE SIGN WAS WRONG AND ONLY A FRAME SAID SO. When the side
  // take started on the LEFT this branch was never exercised at x>0 in a frame I
  // read; starting on the RIGHT put it there and "Perc" came back MIRRORED at
  // t=2.00. Sign inverted and re-read off the same frame. FIFTH label
  // orientation error in this project, and the fifth one found by looking.
  else if (lf === 'x') { const r = cam.position.x > 0 ? 0 : Math.PI;
                         for (const m of labelMeshes) m.rotation.z = r; }
  else for (const m of labelMeshes) m.rotation.z = (cam.position.z < m.position.z) ? Math.PI : 0;

    // ⭐ __paperIso: paperOnly PLUS the sheet geometry, so the frame contains the
    // paper MAP and nothing else. paperOnly alone keeps staff lines and noteheads
    // (paperpix needs the ink); (S3) needs them gone, because they are exactly
    // what swamped the boundary signal when the probe was first built.
    const ISO = window.__paperIso === true;
    if (P.look.paperOnly || ISO) {
      voiceRigs.forEach(r => { r.grp.visible = false; });
      drumRigs.forEach(r => { r.grp.visible = false; });
      arcGroup.visible = false; glowGroup.visible = false;
      if (strikeGroup) strikeGroup.visible = false;
      // ⚠ AND FLAT-LIGHT IT. Removing the disks removes almost all the light,
      // and the first cut of this mode measured ink 0.016 against "paper" 0.035
      // -- both effectively black, and the gate called a correctly printed
      // sheet blank. A gate starved of light reports a defect that is not there
      // just as confidently as it misses one that is.
      if (paperSave === null) paperSave = {
        amb: ambLight.intensity, over: overheadLight ? overheadLight.intensity : 0,
        bloom: bloomPass ? bloomPass.strength : 0, fog: scene.fog };
      // ⚠ ISOLATION NEEDS MORE LIGHT THAN paperpix DOES. paperpix measures INK
      // against paper and 9.0 is tuned for that; with the sheet gone the frame is
      // bare paper under fog-free ambient and read a mean lit luma of 30-36,
      // which put (S3)'s patches under its own 25-luma "too dark to measure"
      // floor and threw the samples away. 45 measures 80.2. paperOnly is left
      // exactly where it was.
      ambLight.intensity = ISO ? (P.look.paperIsoAmbient ?? 45)
                               : (P.look.paperOnlyAmbient ?? 9.0);
      if (overheadLight) overheadLight.intensity = 0;
      if (bloomPass) bloomPass.strength = 0;
      scene.fog = null;
      if (ISO) {
        sheet.visible = false;
        const hw = scene.getObjectByName('holeWalls'); if (hw) hw.visible = false;
      }
    } else {
      sheet.visible = true;
      { const hw = scene.getObjectByName('holeWalls'); if (hw) hw.visible = true; }
      arcGroup.visible = true; glowGroup.visible = true;
      if (strikeGroup) strikeGroup.visible = true;
      // ⛔ AND PUT THE LIGHTS BACK. The first cut of this block asserted in its
      // own comment that clearing the flag restored the scene exactly, and it
      // did not -- ambient, key, bloom and fog were left where paperOnly had
      // dumped them. That is the same comment-asserts / code-undoes shape that
      // produced the mirrored sheet.
      if (paperSave) {
        ambLight.intensity = paperSave.amb;
        if (overheadLight) overheadLight.intensity = paperSave.over;
        if (bloomPass) bloomPass.strength = paperSave.bloom;
        scene.fog = paperSave.fog;
        paperSave = null;
      }
    }

    document.getElementById('prg').style.width =
      (W * Math.min(1, t / (P.total + 1.4))) + 'px';
    comp.render();
    window.__t = t;
  } catch (e) { window.__err = String(e && e.stack || e); }
};
</script>

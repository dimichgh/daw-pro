<script type="module">
// THE ROAD, in three.js. Driven frame-by-frame from puppeteer: window.__init(P)
// builds the scene once, window.__frame(t) puts it at a time and renders. There
// is NO requestAnimationFrame and no wall clock anywhere in this file --
// a dropped frame would silently slide the light off the beat.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ⭐ ROUND 4: THE FRAME IS AN ARGUMENT, NOT A CONSTANT. Landscape 1920x1080
// and the 1080x1920 Short are the SAME SCENE, same song data, same physics,
// same look -- only `width`/`height` and the camera keyframes differ. Forking
// the renderer per aspect would mean two things to tune and one of them
// silently rotting; these are payload fields instead.
let W = 1080, H = 1920;
let R, scene, cam, comp, P, grade, voiceRigs = [], drumRigs = [], arcGroup, paperMat;
let bloomPass, overheadLight, glowGroup, ambLight, paperSave = null;
const WARM = new THREE.Color(1.0, 0.60, 0.26);
// ⚠ WARM ONLY. The reference is cream/amber on near-black for its whole
// 8.2 s -- the cool-blue-ahead grade was inferred from thumbnails and is not
// in the footage. Voices still have to be TELLABLE APART (that was an explicit
// requirement), so they are spread across warm HUES -- gold, amber, cream,
// peach, apricot, pale straw -- rather than around the wheel into blue.
const VOICE_COL = ['#ffd27a', '#ffb45a', '#fff0c0', '#ffc9a0', '#ffa96a', '#ffe9a8'];

// ---- the paper: staff, bar lines, noteheads, stems, drawn ONCE to a canvas --
// ⚠⚠ paperRepV IS A DENSITY WEARING A COUNT'S CLOTHES, and that is a second,
// quieter length-dependence in the same place as the texture wall. `repeat.set(6,
// 90)` puts NINETY fibre periods down the sheet however long the sheet is: 90 over
// the tuning sample's 38.33-unit plane is 2.35 per unit, 90 over a 20-bar plane at
// zPerGap 0.45 is about 0.74 — the paper's own grain getting 3x coarser purely
// because the film got longer. A segmentation that fixed the map and left this
// alone would still have the look drift with length.
// ⭐ THE REFERENCE IS DECLARED, AND ABSENCE IS IDENTITY. With no
// `paperRepRefPH` the ratio is PH/PH = 1 EXACTLY and the count is the old 90; with
// the tuning sample's own measured PH it is also exactly 1. So this cannot move an
// approved look, and it does not silently pick a density for a song that never
// declared one.
function paperRepV() {
  const PH = P.zlen + 2 * (P.look.sheetPad ?? 7.0);
  const ref = P.look.paperRepRefPH ?? PH;
  return (P.look.paperRepV ?? 90) * (PH / ref);
}

function paperTexture() {
  const cv = document.createElement('canvas');
  // ⭐ THE TILE, NOT THE WHOLE ROAD. `paperTileH` is bounded (12288) and
  // `paperRepeatV` wraps it down the length, so this canvas does not grow with
  // the film. Older payloads carry neither field and fall back to the whole-road
  // texture, unchanged. See the long note in lib/prep.mjs for why a repeating
  // tile is EXACT here and not an approximation: the map is grain and tint, and
  // every line, notehead and label is geometry.
  cv.width = P.texW; cv.height = P.paperTileH ?? P.texH;
  const g = cv.getContext('2d');
  // ⚠ A near-white sheet + a lamp per voice clipped the whole road on a
  // four-note chord. The paper is now acream, not a highlight.
  // ⚠⚠ ROUND 7: THE PAPER IS RETIRED. The user: "We need to use gray rough
  // surface that consumes light, make environment darker and light effect
  // better" -- then, correcting a dark-grey first cut: "light gray, not dark."
  // ⭐ SO: A LIGHT GREY ROAD IN A DARK WORLD. The value stays high (this is
  // near the cream's luminance, and the black disks keep the same contrast
  // regime they had on paper); what changes is HUE -- neutral, not warm -- and
  // what gets dark is everything AROUND the road: background, fog, ambient.
  // Roughness stays 0.99 and metalness 0, so it scatters and bounces no sheen.
  g.fillStyle = P.look.paper ?? '#b6b8bd'; g.fillRect(0, 0, cv.width, cv.height);
  // grain, so the lit pool has something to fall on
  const id = g.getImageData(0, 0, cv.width, Math.min(cv.height, 2048));
  let seed = 7;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let y = 0; y < cv.height; y += 2048) {
    const h = Math.min(2048, cv.height - y);
    const im = g.getImageData(0, y, cv.width, h);
    for (let i = 0; i < im.data.length; i += 4) {
      const d = (rnd() * 14 - 7) | 0;
      im.data[i] += d; im.data[i+1] += d; im.data[i+2] += d;
    }
    g.putImageData(im, 0, y);
  }
  // ⚠⚠ THE SEAM CONTROL. `look.paperSeamControl` (a luma offset, 0-255) darkens
  // the last N rows of the TILE so every wrap boundary carries a deliberate mean
  // step. A seam gate that has never been made to fire is a gate that cannot
  // fail; this is what makes lib/seam.mjs's pass mean something. It is off by
  // default and nothing reads it in a shipped render.
  const SEAM = P.look.paperSeamControl ?? 0;
  if (SEAM) {
    // ⛔ THE FIRST CONTROL WAS 40 ROWS AND IT PASSED THE GATE WHILE THE FILM
    // FAILED — the verdicts came out INVERTED. 40 of 12288 rows is 0.097 world
    // units, thinner than the gate's own +-0.10 sampling separation, so both
    // patches straddled the band and neither one landed IN it. A control has to
    // be the failure it is imitating: a mis-registered tile is a STEP IN MEAN
    // LEVEL that runs the length of the tile, not a hairline. So half the tile.
    const n = Math.max(1, Math.round(P.look.paperSeamControlRows ?? cv.height / 2));
    const y0 = Math.max(0, cv.height - n);
    const im = g.getImageData(0, y0, cv.width, cv.height - y0);
    for (let i = 0; i < im.data.length; i += 4) {
      im.data[i] = Math.max(0, im.data[i] - SEAM);
      im.data[i+1] = Math.max(0, im.data[i+1] - SEAM);
      im.data[i+2] = Math.max(0, im.data[i+2] - SEAM);
    }
    g.putImageData(im, 0, y0);
  }
  // ⭐⭐ FIBRE, AS A NORMAL MAP AND A ROUGHNESS MAP, NOT JUST A TINT. The user:
  // "textures of the surfaces and 3d objects should be realistic, not just
  // transparent 3d objects." A flat tint + per-pixel grain gives a surface that
  // is uniformly rough everywhere, so the overhead light falls on it perfectly
  // evenly and it reads as coloured plastic. Paper does not: it has directional
  // fibre and its gloss varies.
  // ⚠ SEEDED AND SMALL AND TILED. Deterministic because the whole
  // stills-equal-sequence property -- which the camera-track architecture rests
  // on -- dies the moment a texture is generated from Math.random(). The same
  // LCG as the grain above, its own seed, and a 512x512 tile repeated rather
  // than a second copy of a 2176x10939 canvas.
  paperNormal = (() => {
    const n = 512, c2 = document.createElement('canvas'); c2.width = c2.height = n;
    const g2 = c2.getContext('2d'); const im = g2.createImageData(n, n);
    let s2 = 20250906;
    const r2 = () => (s2 = (s2 * 1664525 + 1013904223) >>> 0) / 4294967296;
    const hgt = new Float32Array(n * n);
    for (let i = 0; i < n * n; i++) hgt[i] = r2();
    // stretch the noise ALONG x: paper fibre is directional, and isotropic
    // noise reads as sandpaper rather than as paper
    const sm = new Float32Array(n * n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      let a = 0; for (let k = -3; k <= 3; k++) a += hgt[y * n + ((x + k + n) % n)];
      sm[y * n + x] = a / 7;
    }
    const A = P.look.paperBump ?? 2.6;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const dx = (sm[y * n + ((x + 1) % n)] - sm[y * n + ((x - 1 + n) % n)]) * A;
      const dy = (sm[((y + 1) % n) * n + x] - sm[((y - 1 + n) % n) * n + x]) * A;
      const L = Math.hypot(dx, dy, 1), k = (y * n + x) * 4;
      im.data[k]   = ((-dx / L) * 0.5 + 0.5) * 255;
      im.data[k+1] = ((-dy / L) * 0.5 + 0.5) * 255;
      im.data[k+2] = ((1 / L) * 0.5 + 0.5) * 255;
      im.data[k+3] = 255;
    }
    g2.putImageData(im, 0, 0);
    const tx = new THREE.CanvasTexture(c2);
    tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
    tx.repeat.set(P.look.paperRepU ?? 6, paperRepV());
    tx.flipY = false;
    return tx;
  })();
  paperRough = (() => {
    const n = 256, c3 = document.createElement('canvas'); c3.width = c3.height = n;
    const g3 = c3.getContext('2d'); const im = g3.createImageData(n, n);
    let s3 = 90620251;
    const r3 = () => (s3 = (s3 * 1664525 + 1013904223) >>> 0) / 4294967296;
    for (let i = 0; i < n * n; i++) {
      // ⚠ CENTRED HIGH ON PURPOSE. roughness = material.roughness * map.g, so a
      // map centred at 190/255 multiplied 0.94 down to 0.70 and turned the road
      // semi-gloss: the first render with it was a sheet of blown white.
      const v = 246 + (r3() * 18 - 14);
      im.data[i*4] = im.data[i*4+1] = im.data[i*4+2] = v; im.data[i*4+3] = 255;
    }
    g3.putImageData(im, 0, 0);
    const tx = new THREE.CanvasTexture(c3);
    tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
    tx.repeat.set(P.look.paperRepU ?? 6, paperRepV());
    tx.flipY = false;
    return tx;
  })();

  const PXU = cv.width / (2 * P.UMAX);
  const X = x => (x + P.UMAX) * PXU;
  // world z of a time, and the canvas row for a world z (v=1 is the FAR edge)
  const zt = t => -t * P.zps;
  const Y = z => (1 - (z - P.zFar) / P.zlen) * cv.height;
  const PZ = cv.height / P.zlen;

  // ⭐⭐⭐ ROUND 5: THE PAPER IS NOW CONTENT-FREE. Grain and tint, nothing else.
  //
  // Everything that used to be PAINTED here -- staff lines, bar lines, road
  // labels, noteheads, ledger lines, stems, percussion marks -- is now REAL
  // GEOMETRY built by buildSheet(), positioned in the SAME world coordinates
  // the balls already fly through, (x, y, -t*zps).
  //
  // ⛔ THIS IS A FIX FOR A CLASS, NOT FOR TWO BUGS. Painting content into a
  // texture on a plane made the content's coordinate frame INDEPENDENT of the
  // balls' frame, and every defect below is one consequence of that:
  //   - the sheet rendered MIRRORED end to end (flipY vs the Y() mapping), so
  //     31 of 36 melody landings and 24 of 24 drum strikes came down on blank
  //     paper;
  //   - fixing that with flipY=false then rendered every ROAD LABEL mirrored
  //     ("Piano" as "bIɐuo") -- in both formats, from frame 0. I opened that
  //     frame, said in NOTES.md that I had read the label, and had not;
  //   - the struck-note glow was a camera-facing SPRITE hovering over a
  //     painted dot, which the user described exactly: "the circle of the note
  //     should glow, not just part of some cloud covering the note";
  //   - and the notes and lines were flat, which the user asked to change.
  //
  // ⭐ GEOMETRY CANNOT MIRROR AGAINST THE BALLS BECAUSE IT SHARES THEIR FRAME.
  // That is the whole point of the change, and it is why `mirrorPaper` is gone
  // rather than kept as a control: it would now control nothing, and a probe
  // that cannot move anything is a probe that never looked.

  const tx = new THREE.CanvasTexture(cv);
  // ⛔⛔⛔ THE MIRROR. This one line is the whole landing-miss defect the user
  // reported as "the balls bounce off empty space", root-caused by the
  // independent observer and confirmed here from the numbers below.
  //
  // Y(z) above puts zNear at CANVAS ROW 0 and zFar at the last row -- that is
  // what the comment on Y() asserts. But CanvasTexture defaults to flipY=true,
  // so row 0 becomes v=1; the plane is PlaneGeometry rotated -PI/2 about X, so
  // v=1 lies at zFar. Net: drawn_z = zNear + zFar - z, i.e. the printed sheet
  // is the piece REVERSED END TO END, with the balls flying correctly over it.
  //
  // MEASURED, this payload: zNear 1.3, zFar -23.0315, zps 1.8
  //   => mirror constant C = -(zNear+zFar)/zps = 12.0731 s, so a note at t is
  //      printed at 12.0731-t. The observer derived 12.0731 a priori from the
  //      payload and then measured 23 back-projected noteheads against it,
  //      residuals <= 0.005 s. 31 of 36 melody landings sat on blank paper;
  //      0 of 24 drum strikes hit their own mark. The 5 that looked right were
  //      MIRROR COINCIDENCES about t=6.0365 -- which is exactly why it read as
  //      intermittent and survived every spot check I made.
  //
  // ⭐⭐ THE LESSON IS NOT "SET flipY". It is that the comment on Y() ASSERTED
  // the mapping, flipY silently undid it, and NOTHING IN THE PIPELINE COMPARED
  // THE TWO. Every gate I had checked the payload against the payload. The
  // gate that can see this is lib/paperpix.mjs, which looks at the RENDERED
  // PIXELS under the ball -- and it is proven by re-introducing this mirror.
  tx.flipY = false;   // grain is isotropic so this is moot -- but do not re-open the class
  // ⚠ THE WRAP IS SET ONLY WHEN IT IS USED. At repeatV == 1 (the tuning sample,
  // whose 10939 rows fit under the cap) the texture is left exactly as it was,
  // wrapping included, so the approved look cannot move through this branch --
  // and, honestly, so the sample does not test the wrap. seam.mjs tests it on a
  // payload that wraps.
  // ⭐ THE MAP ITSELF IS THE THING (S1) ASKS ABOUT. "The wrap is invisible" is a
  // claim about the TEXTURE — the two sides of a boundary are the tile's last
  // rows and its first rows — and the texture can be measured with no camera, no
  // lighting, no fog and no ink on top of it. This hands lib/seam.mjs the row
  // statistics rather than making it re-photograph the road and try to subtract
  // everything else out.
  window.__paperRowStats = (rows) => {
    const n = Math.max(1, Math.min(rows | 0, Math.floor(cv.height / 4)));
    const mean = y0 => {
      const im = g.getImageData(0, y0, cv.width, n).data;
      let s = 0; for (let i = 0; i < im.length; i += 4) s += 0.299*im[i] + 0.587*im[i+1] + 0.114*im[i+2];
      return s / (im.length / 4);
    };
    const first = mean(0), last = mean(cv.height - n);
    // ⚠ THE SCALE COMES FROM THE TILE'S OWN INTERIOR, not from a luma constant:
    // block means sampled across the middle, differenced pairwise. That is what
    // "as continuous as any other pair of adjacent rows" means, measured.
    const inner = [];
    for (let k = 1; k <= 12; k++) inner.push(mean(Math.round(k * (cv.height - n) / 13)));
    const d = [];
    for (let i = 0; i + 1 < inner.length; i++) d.push(Math.abs(inner[i] - inner[i+1]));
    d.sort((a, b) => a - b);
    return { rows: n, tileH: cv.height, first, last, join: Math.abs(first - last),
             innerMedian: d[Math.floor((d.length - 1) / 2)], innerMax: d[d.length - 1] };
  };

  const repV = P.paperRepeatV ?? 1;
  if (repV > 1) {
    tx.wrapS = THREE.ClampToEdgeWrapping;
    tx.wrapT = THREE.RepeatWrapping;
    tx.repeat.set(1, repV);
  }
  tx.colorSpace = THREE.SRGBColorSpace;
  tx.anisotropy = 16;
  tx.minFilter = THREE.LinearMipmapLinearFilter;
  tx.generateMipmaps = true;
  return tx;
}

function glowSprite(hex, size) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, hex); gr.addColorStop(0.25, hex + '88');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: t, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  s.scale.setScalar(size);
  return s;
}

const GRADE = {
  uniforms: { tDiffuse: { value: null }, uLightY: { value: 0.30 },
              uWarm: { value: new THREE.Vector3(1.0, 0.66, 0.36) },
              uCool: { value: new THREE.Vector3(0.92, 0.86, 0.70) },   // was blue; see VOICE_COL
              uVig: { value: 1.0 } },
  vertexShader: `varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uLightY, uVig;
    uniform vec3 uWarm, uCool; varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      // warm BEHIND the light (below it in frame), cool AHEAD (above it)
      float k = smoothstep(uLightY - 0.30, uLightY + 0.42, vUv.y);
      vec3 tint = mix(uWarm, uCool, k);
      c.rgb *= mix(vec3(1.0), tint, 0.20);
      vec2 d = vUv - 0.5; d.x *= 0.72;
      c.rgb *= mix(1.0, clamp(1.0 - dot(d,d) * 1.45, 0.0, 1.0), uVig);
      gl_FragColor = c;
    }`,
};


// ⭐⭐⭐ THE SHEET, AS REAL GEOMETRY. Round 5, bucket A.
//
// Everything the eye reads as "printed music" is built here, in WORLD
// coordinates (x, y, -t*zps) -- the same frame the playheads fly through. The
// paper underneath is now only grain and tint.
//
// ⚠ WHY INSTANCED, FROM DAY ONE: a long composition is the goal, and one
// Mesh per notehead is the thing that stops being possible first. All the
// pitched heads are one draw call; all the percussion marks are a second.
//
// ⚠ THE STRUCK-NOTE GLOW IS *NOT* HERE, AND IT CANNOT BE. In three.js r185
// `InstancedMesh.instanceColor` reaches the shader as `vColor` and
// `color_fragment.glsl.js` does exactly `diffuseColor *= vColor` -- emissive
// is a plain uniform (`meshphysical.glsl.js`: `vec3 totalEmissiveRadiance =
// emissive;`). So a per-instance emissive flare is not reachable without a
// custom shader patch. Instead a small POOL of individually-materialed disks
// (strikePool) is moved onto struck notes and carries the envelope. Same
// pattern the old sprite pool used, with geometry instead of a billboard.
let sheet, headMesh, percMesh, strikePool = [], labelMeshes = [], strikeGroup;
let envRT = null;
let paperNormal = null, paperRough = null;
let takeCull = null;   // per-take near-cull, set by __camera
const Z_EPS = 0.0016;      // lift off the paper plane; at 0 the disks z-fight

function buildSheet() {
  sheet = new THREE.Group(); scene.add(sheet);
  // ⭐⭐ BLACK, AND BEVELLED, BECAUSE THE CONTRAST IS THE EFFECT. The user:
  // "black to glow create a great effect" -- an unplayed note is a black
  // bevelled disk and the flare when it is struck is the whole point.
  // ⚠ A BLACK DIFFUSE SURFACE REFLECTS NO DIFFUSE LIGHT AT ALL, so a bevel on
  // a pure-black matte disk is invisible and the "3d object rather than a dot"
  // reading is lost. The bevel has to catch a SPECULAR highlight: low
  // roughness and a little metalness, on a near-black rather than a true 0.
  // ⭐ THEY COOL LIKE METAL, SO THEY ARE METAL. High metalness, moderate
  // roughness, and an envMapIntensity so the chamfer has something to reflect
  // -- that specular streak along the bevel is what sells the disk as an
  // object, more than its silhouette does.
  // ⚠ NONE OF THIS IS VISIBLE WITHOUT scene.environment (see __init).
  const inkMat  = new THREE.MeshStandardMaterial({ color: P.look.inkColor ?? 0x060606,
    roughness: P.look.inkRough ?? 0.28, metalness: P.look.inkMetal ?? 0.85,
    envMap: envRT ? envRT.texture : null,
    envMapIntensity: P.look.inkEnv ?? 1.15, side: THREE.DoubleSide });
  const lineMat = new THREE.MeshStandardMaterial({ color: P.look.lineColor ?? 0x0b0a09,
    roughness: P.look.lineRough ?? 0.42, metalness: P.look.lineMetal ?? 0.55,
    envMap: envRT ? envRT.texture : null,
    envMapIntensity: P.look.inkEnv ?? 0.9, side: THREE.DoubleSide });
  // ⭐ A CHAMFERED DISK, extruded from a circle. ExtrudeGeometry's bevel is the
  // chamfer; the geometry is built with unit radius and unit height so the
  // existing instanced scale calls still mean what they meant.
  const bevelDisk = (segs = 30) => {
    const bs = P.look.noteBevel ?? 0.26;      // bevel size as a fraction of radius
    const sh = new THREE.Shape();
    sh.absarc(0, 0, 1 - bs, 0, Math.PI * 2, false);
    const g = new THREE.ExtrudeGeometry(sh, { depth: 1 - 2 * bs, bevelEnabled: true,
      bevelThickness: bs, bevelSize: bs, bevelSegments: P.look.noteBevelSegs ?? 3, curveSegments: segs });
    g.translate(0, 0, -(0.5 - bs));           // centre it on the origin
    g.rotateX(-Math.PI / 2);                  // extrude along +z -> lie flat on the paper
    return g;
  };
  const bevelBox = () => {
    const bs = P.look.lineBevel ?? 0.30;      // as a fraction of the HEIGHT
    const sh = new THREE.Shape();
    const hw = 0.5, hh = 0.5 - bs;
    sh.moveTo(-hw, -hh); sh.lineTo(hw, -hh); sh.lineTo(hw, hh); sh.lineTo(-hw, hh); sh.closePath();
    const g = new THREE.ExtrudeGeometry(sh, { depth: 1, bevelEnabled: true,
      bevelThickness: bs, bevelSize: bs * 0.5, bevelSegments: 1, curveSegments: 1 });
    g.translate(0, 0, -0.5);
    return g;   // unit cube-ish, x = width, y = height, z = length
  };
  const lineGeo = bevelBox();
  const LH = P.look.sheetLineH ?? 0.007;    // how far the engraving stands proud
  const LW = P.look.sheetLineW ?? 0.009;    // staff line width, in world x
  const DH = P.look.noteH ?? 0.026;         // ⭐ THE DISK'S THICKNESS = the "volume" the user asked for
  // ⭐⭐ THE SHEET RUNS OFF INTO THE DARK AT BOTH ENDS, rather than stopping at
  // a cut edge. The observer confirmed the far edge is visible with black
  // beyond it in the final frame of both cuts; the reverse-angle take then put
  // the sheet's START edge in shot too, from the first second. One fix covers
  // both: pad the paper and the staff lines past the music at each end so the
  // road always continues past what the fog can still show, and no frame ever
  // contains the paper's own boundary. The MUSIC is unchanged -- notes, bars
  // and marks still live only where they always did.
  const PAD = P.look.sheetPad ?? 7.0;
  const zLenPad = P.zlen + 2 * PAD;
  const zmid = (P.zNear + P.zFar) / 2;
  const ROADS = (P.roads && P.roads.length) ? P.roads
              : [{ index: 0, x0: 0, lines: 5, name: '', color: '#c2b9a4' }];

  // ---- staff / road lines: thin extruded boxes running the road's length ----
  for (const rd of ROADS) {
    const n = rd.lines ?? 5, ctr = (5 - n) / 2 * P.SP;
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(lineGeo, lineMat);
      m.scale.set(LW, LH, zLenPad);
      m.position.set(rd.x0 + P.BOT_X + ctr + i * P.SP, LH / 2, zmid);
      sheet.add(m);
    }
    // ---- bar lines, across the staff ----
    const xa = rd.x0 + P.BOT_X + ctr, xb = xa + (n - 1) * P.SP;
    const span = Math.max(xb - xa, 0.02) + LW * 2;
    for (const b of P.bars) {
      const th = b.heavy ? 0.034 : 0.019;
      const m = new THREE.Mesh(lineGeo, lineMat);
      m.scale.set(span, LH * 0.92, th);
      m.position.set((xa + xb) / 2, LH * 0.46, -b.t * P.zps);
      sheet.add(m);
    }
  }

  const diskGeo = bevelDisk(30);
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3();
  const put = (mesh, i, x, y, z, sx, sy, sz) => {
    M.compose(V.set(x, y, z), Q, new THREE.Vector3(sx, sy, sz));
    mesh.setMatrixAt(i, M);
  };

  // ---- pitched noteheads ----
  // ⚠ NARROWER ACROSS PITCH THAN ALONG THE ROAD (0.74), exactly as the painted
  // ellipse was: far up the road perspective flattens a second of music into a
  // few pixels of depth while pitch still spreads the full staff width, so
  // round heads ran together into a chain of blobs.
  const heads = P.notes || [];
  headMesh = new THREE.InstancedMesh(diskGeo, inkMat, Math.max(1, heads.length));
  headMesh.count = heads.length;
  // ⚠ `noteZOffset` IS lib/paperpix.mjs's CONTROL, and it lives here on purpose:
  // it displaces the PRINTED note along the road while the playhead disks keep
  // flying to the true position, which is the whole class of "the balls and the
  // sheet disagree" -- the mirror was one instance of it. A payload edit could
  // not express this, because the payload is what both sides are derived from.
  const NZ = P.look.noteZOffset ?? 0;
  heads.forEach((nn, i) => put(headMesh, i, nn.x, DH / 2 + Z_EPS, -nn.t * P.zps + NZ,
                               P.NOTE_R * 0.74, DH, P.NOTE_R));
  headMesh.instanceMatrix.needsUpdate = true;
  sheet.add(headMesh);

  // ---- ledger lines and stems, also boxes ----
  const extras = [];
  for (const nn of heads) {
    const z = -nn.t * P.zps;
    for (let st = -2; st >= nn.step; st -= 2)
      extras.push([nn.x, z, P.NOTE_R * 2.3, 0.016, st]);
    for (let st = 10; st <= nn.step; st += 2)
      extras.push([nn.x, z, P.NOTE_R * 2.3, 0.016, st]);
    const up = nn.step < 4;
    extras.push([nn.x + (up ? 1.15 : -1.15) * P.STEP_X, z, 2.3 * P.STEP_X, 0.012, null]);
  }
  if (extras.length) {
    const em = new THREE.InstancedMesh(lineGeo, lineMat, extras.length);
    // ⛔ SCALE Y WAS 1 HERE AND THAT WAS CORRECT ONLY WHILE THE GEOMETRY WAS
    // BoxGeometry(1, LH*0.9, 1) -- the height was BAKED IN. lineGeo is a UNIT
    // box, so the same call made every ledger line and stem a 1.0-unit-tall
    // slab: the first frame after the bevel change was a road covered in
    // vertical grey squares. Swapping a geometry silently changes what a
    // scale means.
    extras.forEach((e, i) => put(em, i, e[0], LH * 0.45, e[1], e[2], LH * 0.9, e[3]));
    em.instanceMatrix.needsUpdate = true;
    sheet.add(em);
  }

  // ---- percussion marks: the same primitive, in the road's own colour ----
  const side = P.side || [];
  const percCol = new THREE.Color(side.length ? side[0].color : '#ffb45a');
  const percMat = new THREE.MeshStandardMaterial({
    color: percCol.clone().multiplyScalar(0.34), roughness: 0.78,
    emissive: percCol, emissiveIntensity: P.look.percEmissive ?? 0.16,
    envMap: envRT ? envRT.texture : null, envMapIntensity: P.look.percEnv ?? 0.5,
    metalness: P.look.percMetal ?? 0.45, side: THREE.DoubleSide });
  // ⚠ WITH HOLES ON, THE PRINTED MARK IS THE HOLE. Leaving both draws a disk
  // sitting over the opening, which is exactly the 'painted circle' reading
  // the holes exist to replace.
  percMesh = new THREE.InstancedMesh(diskGeo, percMat, Math.max(1, side.length));
  percMesh.count = (P.look.drumHoles ?? 1) ? 0 : side.length;
  side.forEach((sd, i) => {
    const r = P.NOTE_R * (P.look.percR ?? 0.62) * (0.80 + 0.45 * sd.vel);
    put(percMesh, i, sd.u, DH / 2 + Z_EPS, -sd.t * P.zps + NZ, r * 0.9, DH, r);
  });
  percMesh.instanceMatrix.needsUpdate = true;
  sheet.add(percMesh);

  // ---- the struck-note pool: real disks that GLOW, not sprites over a dot ----
  // user: "the circle of the note should glow, not just part of some cloud
  // covering the note". This is that circle, and the glow is emissive through
  // the bloom pass rather than an additive billboard hovering above it.
  // ⛔⛔⛔ THE AFTERGLOW NEVER REACHED BLACK, AND THE CAUSE WAS NOT THE DECAY
  // CURVE. The user: "the note disks are black, but they stay lighted not
  // fully decaying". The emissive DID reach zero -- but this pool used its own
  // material (color 0x2a231c, roughness 0.6) and its own 1.04x scale, sitting
  // proud of the head it covers. So at emissiveIntensity 0 a struck note was
  // still a LIGHTER, BIGGER disk than an unstruck one, permanently, and they
  // accumulated down the road as the film went on. Chasing the decay curve
  // would never have fixed it.
  //
  // ⭐ THE FIX IS STRUCTURAL, NOT A TUNING. Each pool disk is now the SAME
  // geometry and the SAME material parameters as a notehead, plus an emissive
  // term. At emissiveIntensity 0 it IS a notehead, by construction -- there is
  // no floor left to get wrong, and "indistinguishable from a never-struck
  // disk" stops depending on two numbers agreeing.
  //
  // ⚠ AND THE POOL MUST NOT BE SMALLER THAN THE NUMBER OF NOTES. It is filled
  // brightest-first from a sorted list, so a pool that overflows drops the
  // DIMMEST member -- an ember at 30 % would snap to black the instant a new
  // note was struck. Sized to the note count so the sort can never truncate.
  strikePool = [];
  strikeGroup = new THREE.Group(); scene.add(strikeGroup);
  // ⭐⭐ THE POOL IS SIZED TO WHAT CAN BE LIT AT ONCE, NOT TO THE WHOLE FILM.
  // It used to be one Mesh (with its own material) per notehead, and __frame
  // walks the WHOLE pool every frame — so both memory and per-frame work grew
  // linearly with length for no gain: a note older than the decay window is
  // never in S.strikes, so its mesh was permanently invisible.
  // ⚠ THE BOUND IS EXACT, NOT A GUESS: the census can only ever light notes
  // inside one decay window, so the most that can be lit simultaneously is the
  // most notes any window-long span contains — computed here from the payload
  // by a sliding window. The warning above (a pool that overflows drops the
  // DIMMEST member and snaps an ember to black) is respected, not weakened.
  // ⚠ afterFloor > 0 keeps every note lit forever by design; that case keeps the
  // old per-notehead sizing.
  const POOL = (() => {
    const cap = Math.max(P.look.afterPool ?? 0, heads.length + 4);
    if (true) return cap;
    const tau = P.look.afterDecay ?? 1.6, fl = P.look.afterFlash ?? 0.0;
    const W = tau * Math.log((1 + fl) / Math.max(1e-9, P.look.afterCut ?? 0.004));
    const ts = [];
    for (const v of (P.voices || [])) for (const n of (v.notes || [])) ts.push(n.t);
    ts.sort((a, b) => a - b);
    let j = 0, mx = 0;
    for (let i = 0; i < ts.length; i++) { while (ts[i] - ts[j] > W) j++; mx = Math.max(mx, i - j + 1); }
    return Math.min(cap, mx + 4);
  })();
  for (let i = 0; i < POOL; i++) {
    const mat = new THREE.MeshStandardMaterial({ color: inkMat.color.clone(),
      roughness: inkMat.roughness, metalness: inkMat.metalness,
      envMap: inkMat.envMap, envMapIntensity: inkMat.envMapIntensity,
      emissive: new THREE.Color(0, 0, 0), emissiveIntensity: 0,
      toneMapped: true, side: THREE.DoubleSide });
    const m = new THREE.Mesh(diskGeo, mat);
    m.visible = false; m.renderOrder = 2;
    strikeGroup.add(m); strikePool.push(m);
  }

  // ---- road labels, as world-space quads ----
  // ⚠ THE LABEL IS THE ONE THING STILL CARRIED BY A TEXTURE, because three
  // ships no typeface JSON here (`examples/fonts/` does not exist in this
  // install) and troika is not installed, so TextGeometry has no font to load.
  // That puts it back in reach of the exact flipY trap that started round 5 --
  // so its orientation is NOT asserted anywhere. It is read off a rendered
  // frame with a crop, by eye, and the result is written in NOTES.md.
  labelMeshes = [];
  if (P.look.roadLabels ?? 1) {
    for (const rd of ROADS) {
      if (!rd.name) continue;
      const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
      const g = cv.getContext('2d');
      g.clearRect(0, 0, 512, 128);
      // ⚠ ROUND 7: PAYLOAD-DRIVEN, and the default stayed DARK. A first cut
      // flipped it light for a dark-grey road; the user corrected the road to
      // LIGHT grey, so dark ink is right again. The value travels with the look
      // rather than being baked in, which is the actual fix.
      g.fillStyle = P.look.labelColor ?? '#2b2724';
      g.font = '600 74px -apple-system, Helvetica, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(rd.name, 256, 64);
      const tx = new THREE.CanvasTexture(cv);
      tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 16;
      const w = P.look.labelW ?? 0.95, h = w * 128 / 512;
      const mat = new THREE.MeshStandardMaterial({ map: tx, transparent: true, roughness: 0.95, side: THREE.DoubleSide });
      // ⚠ ONE LABEL IS NO LABEL. Round 4 drew the name at the heavy bar lines
      // only -- two in the whole piece -- so for most of the film there was no
      // label anywhere in frame, and I still recorded it as "drawn". Repeat it
      // at every bar so the road is named wherever you look.
      for (const b of P.bars) {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
        m.rotation.x = -Math.PI / 2;
        m.position.set(rd.x0, Z_EPS * 1.5, -b.t * P.zps - h * 0.9);
        sheet.add(m); labelMeshes.push(m);
      }
    }
  }
}

window.__init = function (payload) {
  try {
    P = payload;
    // ⭐ THE ASSERT ballAt's BINARY SEARCH DEPENDS ON. A comment here used to
    // CLAIM this check existed while no code did it — exactly the shape this
    // file warns about elsewhere. An unsorted voice would give a wrong k, and a
    // wrong ball position is not something any gate downstream would name.
    _clk = null;
    (P.voices || []).forEach((v, vi) => {
      const ns = v.notes || [];
      for (let i = 1; i < ns.length; i++)
        if (ns[i].t < ns[i-1].t)
          throw new Error('voice ' + vi + ' notes not ascending at ' + i +
                          ': t=' + ns[i-1].t + ' then t=' + ns[i].t);
    });
    W = P.width  ?? 1080;
    H = P.height ?? 1920;
    const cvs = document.getElementById('c');
    cvs.width = W; cvs.height = H;
    // the title block scales with the frame so it does not swamp a 1080-tall shot
    const fs = H / 1920;
    document.getElementById('ttl').style.fontSize = (44 * fs).toFixed(1) + 'px';
    document.getElementById('ttl').style.margin = `${44*fs}px 0 0 ${52*fs}px`;
    document.getElementById('sub').style.fontSize = (25 * fs).toFixed(1) + 'px';
    document.getElementById('sub').style.margin = `${14*fs}px 0 0 ${54*fs}px`;
    R = new THREE.WebGLRenderer({ canvas: cvs, antialias: true });
    R.setPixelRatio(1); R.setSize(W, H, false);
    // ⭐⭐⭐ AN ENVIRONMENT, AND WITHOUT IT THE WHOLE MATERIAL DIRECTION FAILS
    // SILENTLY. The user asked for note disks that cool like metal, and for
    // surfaces that read as materials rather than plastic primitives. A METAL
    // MATERIAL WITH NOTHING TO REFLECT RENDERS NEAR-BLACK AND FLAT: metalness
    // removes the diffuse response, so a metal disk in a scene with no
    // environment is a featureless hole, and the obvious conclusion -- "black
    // metal disks were the wrong direction" -- would have been a lighting
    // diagnosis mistaken for an art-direction one.
    // RoomEnvironment ships inside three.js, is generated in-process and
    // fetches nothing, which matters because this harness is offline: a failed
    // network texture fetch looks exactly like never having tried.
    // ⛔⛔⛔ ROUND 7: RoomEnvironment WAS THE "DISKS NEVER DECAY" DEFECT.
    // The user, watching r9: "the note disks does not decay and stay lighted
    // far away towards the start". I had reported the reach-zero fix as
    // structural and afterglow.mjs was green. BOTH WERE TRUE AND THE DEFECT WAS
    // REAL, because it was never the afterglow. MEASURED, two renders of the
    // SAME frame (track-tight t=6.60):
    //     afterGain 0 (no afterglow at all) -> every far disk STILL a white
    //                                          speck, all the way to the horizon
    //     inkEnv 0   (no env reflection)    -> far disks BLACK; the near ones
    //                                          correctly red/orange
    // RoomEnvironment is a bright white studio box. inkMat is metalness 0.85 /
    // roughness 0.28 -- a near-mirror -- and every disk down the road is seen at
    // a GRAZING angle, which is exactly where a mirror returns the brightest
    // part of its surroundings. So each disk carried a permanent specular
    // highlight that no decay curve could ever remove.
    // ⚠ AND THE GATE COULD NOT SEE IT, BY CONSTRUCTION: afterglow.mjs
    // normalises the struck disk against the SAME disk with the glow off, so
    // the specular is subtracted out of BOTH sides of its ratio. It measured
    // the right quantity; the quantity was the wrong one. See afterglow.mjs (B).
    //
    // ⭐ THE FIX IS A DARKER ENVIRONMENT, NOT NO ENVIRONMENT. envMap 0 makes a
    // metal render dead-black and featureless, which is the failure the round-6
    // addendum warned about. So: a custom env scene -- a black room with one
    // dim soft overhead panel and a weak fill -- PMREM'd the same way. Built
    // from primitives with no randomness at all, so it is deterministic by
    // construction and stills-equal-sequence survives.
    {
      const pm = new THREE.PMREMGenerator(R);
      pm.compileEquirectangularShader();
      let src;
      if (P.look.envRoom === true) {
        src = new RoomEnvironment();          // the r9 look, kept for A/B only
      } else {
        src = new THREE.Scene();
        const shell = new THREE.Mesh(
          new THREE.BoxGeometry(20, 20, 20),
          new THREE.MeshBasicMaterial({ color: new THREE.Color(P.look.envShell ?? 0x020202),
                                        side: THREE.BackSide }));
        src.add(shell);
        const key = P.look.envKey ?? 0.30, fill = P.look.envFill ?? 0.05;
        const panel = new THREE.Mesh(new THREE.PlaneGeometry(7, 7),
          new THREE.MeshBasicMaterial({ color: new THREE.Color(key, key * 0.94, key * 0.86) }));
        panel.position.set(0, 9.9, 0); panel.rotation.x = Math.PI / 2;
        src.add(panel);
        const back = new THREE.Mesh(new THREE.PlaneGeometry(18, 12),
          new THREE.MeshBasicMaterial({ color: new THREE.Color(fill, fill, fill * 1.08) }));
        back.position.set(0, 0, -9.9);
        src.add(back);
      }
      envRT = pm.fromScene(src, 0.04);
      pm.dispose();
    }
    R.toneMapping = THREE.ACESFilmicToneMapping;
    R.toneMappingExposure = P.look.exposure ?? 0.85;
    R.outputColorSpace = THREE.SRGBColorSpace;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(P.look.bg ?? 0x040405);
    // ⚠ scene.environment ONLY -- NOT scene.background. Reflections yes; a lit
    // room behind the road would destroy the black surround the whole look
    // depends on. envMapIntensity below keeps it a sheen, not a studio.
    // ⛔⛔ NOT scene.environment. MEASURED, because the first cut of this DID
    // use it and the road came back a sheet of blown white:
    //     scene.environment on  -> median luma 0.943, 89 % of frame lit
    //     scene.environment off -> median luma 0.321, 66 %
    // and, decisively, paperMat's own envMapIntensity had NO EFFECT AT ALL --
    // 0.00, 0.02 and 0.05 all rendered byte-for-byte the same. In this three
    // build the scene environment is not scaled by a material's
    // envMapIntensity, so there is no way to say "metals reflect it, paper does
    // not" from the material side.
    // ⭐ So the env map is assigned PER MATERIAL instead, to the metals only
    // (see buildSheet). Same reflections on the disks, no IBL flood on the
    // paper, and envMapIntensity works again because the map is the material's.
    scene.fog = new THREE.FogExp2(P.look.bg ?? 0x040405, P.look.fog ?? 0.062);

    cam = new THREE.PerspectiveCamera(42, W / H, 0.05, 400);

    // ⚠ DoubleSide: the reverse-angle take can see the sheet's underside and its
    // START edge, neither of which the following camera ever pointed at.
    const paperMap = paperTexture();   // also builds paperNormal / paperRough
    paperMat = new THREE.MeshStandardMaterial({ map: paperMap,
      normalMap: paperNormal, normalScale: new THREE.Vector2(P.look.paperNormK ?? 0.55, P.look.paperNormK ?? 0.55),
      roughnessMap: paperRough, roughness: P.look.paperRough ?? 0.99, metalness: 0.0,
      side: THREE.DoubleSide });   // no envMap: the paper is lit, not reflective
    // ⭐⭐⭐ THE ROAD NOW HAS REAL HOLES IN IT, ONE PER DRUM HIT.
    // ⚠⚠ THIS SUPERSEDES A "DO NOT CHANGE" NOTE. Round 5 recorded the falling
    // drum balls as WANTED, on the user's "drums/kick are pefect!", and told
    // the next observer not to re-file them. The user has since said: "drums
    // should be holes and light disks should jump out of them on beat." That
    // reverses it. The old note is superseded, not correct -- see NOTES.md.
    const PW = 2 * P.UMAX, PH = P.zlen + 2 * (P.look.sheetPad ?? 7.0);
    const zmid0 = (P.zNear + P.zFar) / 2;
    let paper;
    const HOLES = (P.look.drumHoles ?? 1) ? (P.side || []) : [];
    if (HOLES.length) {
      // The plane lies in local XY and is then rotated -90 deg about X, which
      // sends local +y to world -z. So a hit at world z maps to local
      // y = zmid - z, and that is the only coordinate conversion here.
      const sh = new THREE.Shape();
      sh.moveTo(-PW/2, -PH/2); sh.lineTo(PW/2, -PH/2);
      sh.lineTo(PW/2, PH/2); sh.lineTo(-PW/2, PH/2); sh.closePath();
      for (const sd of HOLES) {
        const r = P.NOTE_R * (P.look.holeR ?? 0.78) * (0.80 + 0.45 * sd.vel);
        const hy = zmid0 - (-sd.t * P.zps);
        const h = new THREE.Path();
        h.absarc(sd.lane ?? sd.u, hy, r, 0, Math.PI * 2, true);
        sh.holes.push(h);
      }
      const geo = new THREE.ShapeGeometry(sh, P.look.holeSegs ?? 22);
      // ⚠ ShapeGeometry's UVs are the raw XY COORDINATES, not [0,1]. Left as
      // they come, the paper texture tiles once per world unit and the grain
      // turns into a moire. Remap to PlaneGeometry's own convention so the
      // existing texture, normal map and roughness map are all unaffected.
      const uv = geo.attributes.uv, pos = geo.attributes.position;
      for (let i = 0; i < uv.count; i++)
        uv.setXY(i, (pos.getX(i) + PW/2) / PW, (pos.getY(i) + PH/2) / PH);
      uv.needsUpdate = true;
      geo.computeVertexNormals();
      paper = new THREE.Mesh(geo, paperMat);
    } else {
      paper = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH, 1, 256), paperMat);
    }
    paper.rotation.x = -Math.PI / 2;
    paper.position.z = zmid0;
    scene.add(paper);

    // ⭐⭐ THE BOUNDARIES ARE READ OFF THE MESH, NOT RE-DERIVED. lib/seam.mjs
    // needs the world z of each texture wrap. Working it out a second time from
    // PH, zmid0, flipY and repeat is exactly the "two representations of one
    // concept drifting" shape this file already warns about elsewhere — and it
    // is what made the gate's first cut sample the wrong z and read a CONTROL as
    // clean. So the page reports what it actually built.
    window.__paperBounds = () => {
      const t = paperMat.map, rep = t.repeat.y;
      const g = paper.geometry.attributes;
      // measure v -> local y from the geometry itself, then local y -> world z
      let a = null, b2 = null;
      for (let i = 0; i < g.uv.count; i++) {
        const v = g.uv.getY(i), ly = g.position.getY(i);
        if (!a || v < a.v) a = { v, ly };
        if (!b2 || v > b2.v) b2 = { v, ly };
      }
      const zOf = v => {
        const ly = a.ly + (v - a.v) / (b2.v - a.v) * (b2.ly - a.ly);
        return paper.position.z - ly;              // rotation -PI/2: local +y -> world -z
      };
      const out = [];
      for (let k = 1; k < Math.ceil(rep); k++) out.push({ k, v: k / rep, z: zOf(k / rep) });
      return { repeat: rep, flipY: t.flipY, texH: t.image.height, texW: t.image.width,
               vLo: a.v, vHi: b2.v, zAtVLo: zOf(a.v), zAtVHi: zOf(b2.v), bounds: out };
    };

    // ---- the hole WALLS, so an opening reads as depth and not as a painted
    // black circle. Open-ended cylinders hanging below the road, lit by the
    // same overhead key, DoubleSide so the far wall is visible through the near
    // opening.
    if (HOLES.length && (P.look.holeWalls ?? 1)) {
      const wallMat = new THREE.MeshStandardMaterial({
        // ⚠ NOT NEAR-BLACK. A black wall in a black hole is a painted circle
        // again -- the wall has to CATCH the overhead key for the opening to
        // read as depth. Warm and mid-dark, so the lit near wall and the
        // shadowed far wall separate.
        color: P.look.holeWallColor ?? 0x6e7076, roughness: P.look.holeWallRough ?? 0.5,
        metalness: P.look.holeWallMetal ?? 0.35,
        envMap: envRT ? envRT.texture : null, envMapIntensity: P.look.holeWallEnv ?? 0.6,
        side: THREE.DoubleSide });
      const wallGeo = new THREE.CylinderGeometry(1, 1, 1, P.look.holeSegs ?? 22, 1, true);
      const depth = P.look.holeDepth ?? 0.42;
      const wm = new THREE.InstancedMesh(wallGeo, wallMat, HOLES.length);
      wm.name = 'holeWalls';
      const MM = new THREE.Matrix4();
      HOLES.forEach((sd, i) => {
        const r = P.NOTE_R * (P.look.holeR ?? 0.78) * (0.80 + 0.45 * sd.vel);
        MM.compose(new THREE.Vector3(sd.lane ?? sd.u, -depth / 2, -sd.t * P.zps),
                   new THREE.Quaternion(), new THREE.Vector3(r, depth, r));
        wm.setMatrixAt(i, MM);
      });
      wm.instanceMatrix.needsUpdate = true;
      scene.add(wm);
    }
    buildSheet();

    // ⚠ ROUND 7: the ambient was WARM AMBER (0x3a2f22), which is what made a
    // grey road read as beige in the first cut of this change. Neutral now, and
    // payload-driven so the "darker environment" is one number.
    ambLight = new THREE.AmbientLight(P.look.ambientColor ?? 0x2a2c30, P.look.ambient ?? 0.55);  // was 0x24304f (blue)
    scene.add(ambLight);
    const cool = new THREE.DirectionalLight(0xffcf9a, P.look.coolFill ?? 0.32);  // was 0x6f8fff (blue)
    cool.position.set(0.2, 1.0, -1.0); scene.add(cool);

    // ⭐ THE OVERHEAD KEY LIGHT REVEALS; THE NOTE LIGHT DRAMATISES. Two jobs,
    // and one lamp cannot do both -- without this the road only exists where a
    // note light happens to be, and everything else is black.
    // ⚠ ITS COLOUR IS WARM-NEUTRAL ON PURPOSE. The only ambient here is blue
    // (0x24304f), and a sheet of paper lit blue still reads as "dark" however
    // much of it you add. This is near the paper's own #c2b9a4.
    // DEFAULT 0 so an unset payload renders bit-identically to before it existed.
    // ⚠ ROUND 7: the key was WARM (0xffe9c8) and it was what made a neutral
    // grey road still render cream. Neutral key + warm playhead lights is the
    // whole point of the note the user made: the GROUND is grey, the LIGHT
    // EFFECT is warm, and you can now tell them apart.
    overheadLight = new THREE.DirectionalLight(P.look.overheadColor ?? 0xd8dade, P.look.overhead ?? 0.0);
    overheadLight.position.set(0.0, 10.0, 0.0);
    overheadLight.target.position.set(0.0, 0.0, 0.0);
    scene.add(overheadLight, overheadLight.target);

    // one rig per VOICE: a point light that throws the pool, a white core, a halo
    voiceRigs = P.voices.map((v, i) => {
      // ⭐⭐ THE HUE COMES FROM THE ROAD'S OWN TRACK COLOUR, and it varies
      // WITHIN the road so voices stay tellable apart.
      // ⛔ THIS WAS DEAD DATA. `roads[].color` was carried all the way through
      // prep into the payload and then used by nothing: the rigs still indexed
      // a global VOICE_COL palette by GLOBAL voice number, so the bass ball
      // came out apricot (voice 4 of 5) and the piano's four voices took four
      // unrelated hues. The band table said one thing and the render did
      // another, and no check compared them — this project's characteristic
      // failure, in a new costume.
      // ⚠ THE FALLBACK IS LEAD, NOT GARNISH: a payload with no `roads` (round 3
      // and earlier) takes the old palette by the old index, which is what keeps
      // the byte-identical regression control valid.
      let hex;
      const rd = P.roads && P.roads[v.road ?? 0];
      if (rd && rd.color) {
        const hsl = {}; new THREE.Color(rd.color).getHSL(hsl);
        // how many voices of THIS road came before it
        let within = 0;
        for (let j = 0; j < i; j++) if ((P.voices[j].road ?? 0) === (v.road ?? 0)) within++;
        const k = within % 4;
        hex = '#' + new THREE.Color().setHSL(
          (hsl.h + k * (P.look.voiceHueSpread ?? 0.016) + 1) % 1,
          Math.max(0, Math.min(1, hsl.s * (1 - 0.13 * k))),
          Math.max(0, Math.min(0.95, hsl.l + 0.075 * k))).getHexString();
      } else hex = VOICE_COL[i % VOICE_COL.length];
      const col = new THREE.Color(hex);
      const tint = col.clone().lerp(WARM, 0.55);
      // ⛔ THE LAMP IS WHITER THAN THE LOOK. The clipping the observer found is
      // not in the cores -- neutralising those barely moved it -- it is the LIT
      // PAPER: a warm lamp on warm paper drives the red channel to 255 while
      // green is still climbing, so the brightest pool posterises to orange
      // instead of blooming white. The warmth of the film comes from the paper,
      // the halos and the trail; the lamp itself does not need to carry it.
      const lampCol = tint.clone().lerp(new THREE.Color(1, 1, 1), P.look.lampWhite ?? 0.55);
      // ⚠ A POINT LIGHT SITTING ON THE PAPER BLOWS OUT. Illuminance goes as
      // 1/d^2 and the notehead is 0.03 above the sheet, so the first cut was a
      // ~40x spike that clipped the whole lower half to white. The lamp is
      // lifted clear of the paper and its falloff softened; the CORE stays on
      // the note, which is what the eye reads as "the light is on the note".
      const light = new THREE.PointLight(lampCol, 0, P.look.lightDist ?? 8, P.look.decay ?? 1.6);
      light.position.y = P.look.lampLift ?? 0.62;
      // ⚠ AND THE CORE MUST BE SMALL. At 0.028 it rendered as a ~60 px white
      // disc that bloom then smeared wider still; the reference's balls are
      // TIGHT POINTS with a pool around them, not discs. Radius is a look knob
      // now (coreR) precisely because it interacts with bloomStrength.
      // ⚠ 0xffffff IS NOT WHITE-HOT. Under ACES tone mapping a 1.0 basic
      // material lands around 0.8 and the core reads as a grey pebble; the
      // reference's core CLIPS. Values above 1 are legal and are the point.
      const cc = col.clone().multiplyScalar(3.2);
      // ⭐⭐ ROUND 5, BUCKET D: THE PLAYHEAD IS A DISK, NOT A BALL. The user:
      // "we can also make balls as playhead disks (not balls, flying flat same
      // as node disks) with slight glow and when they bounce they glow stronger
      // with the note disks". Same primitive as every notehead, lying flat,
      // travelling. It never tilts -- a disk that banks into the arc reads as a
      // coin flipping, not as a playhead.
      const core = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 28),
        new THREE.MeshBasicMaterial({ toneMapped: false,
          // ⛔ A CORE THAT CLIPS IN RED ALONE GOES ORANGE AND POSTERISES. The
          // observer measured 1134 px at R>=254 while G<254 against 19 truly
          // white px; round 5's emissive note disks pushed that to 16715 px.
          // The warmth belongs to the HALO and the point light, which are not
          // clipped -- the core itself is neutralised so that when it does
          // clip, it clips to WHITE.
          color: new THREE.Color(4.60 + cc.r * 0.45, 4.54 + cc.g * 0.45, 4.44 + cc.b * 0.45) }));
      const pr = P.look.playR ?? (P.NOTE_R * 0.80), ph = (P.look.noteH ?? 0.026) * 0.85;
      core.userData.base = new THREE.Vector3(pr * 0.74, ph, pr);
      // ⛔⛔⛔ THE FULL-BRIGHTNESS COLOUR, KEPT, BECAUSE env MUST SCALE IT.
      // For three rounds this material was set once here and never touched
      // again, while `apply` scaled only the disk's SIZE and the halo's
      // OPACITY. So a voice "arriving at env 0.013" was true in STATE and
      // FULL BRIGHTNESS IN PIXELS: the fade-in existed in the model and never
      // reached the screen. Measured on the shipped r8 landscape, decoded by
      // frame NUMBER, 600x300 crop at (300,200): n=221 max luma 121 with 0 px
      // >=200, then n=222 max 255 with 9704 px >=200. One frame.
      // ⭐ AND THE SAME OMISSION IS THE ENDING: at the end env decays past the
      // live>0.01 cutoff while the core is still at full colour, so every rig
      // SWITCHED OFF rather than dimming out -- 27754 -> 1520 px >=200 between
      // n=399 and n=400, on the frame a scroller lingers on.
      core.userData.col = core.material.color.clone();
      const halo = glowSprite('#fff2dc', P.look.halo ?? 0.26);
      const halo2 = glowSprite(hex, P.look.halo2 ?? 0.80);
      const grp = new THREE.Group();
      grp.add(light, core, halo, halo2);
      scene.add(grp);
      return { grp, light, core, halo, halo2, col, tint, notes: v.notes, road: v.road ?? 0 };
    });

    drumRigs = P.drums.map(d => {
      const col = new THREE.Color(d.color);
      const light = new THREE.PointLight(col, 0, 6, P.look.decay ?? 1.6);
      // ⭐ A FLAT LIGHT DISK, not a ball. The user: "light disks should jump
      // out of them on beat" -- the same primitive as the playhead, so the two
      // read as the same family of object.
      const dr = P.look.drumCoreR ?? 0.030;
      const core = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 26),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(4.85, 4.74, 4.58), toneMapped: false }));
      core.scale.set(dr, dr * 0.42, dr);
      core.userData.base = new THREE.Vector3(dr, dr * 0.42, dr);
      const halo = glowSprite(d.color, P.look.drumHalo ?? 0.34);
      const grp = new THREE.Group(); grp.add(light, core, halo);
      grp.visible = false; scene.add(grp);
      return { grp, light, core, halo, d, road: d.road ?? 0 };
    });

    arcGroup = new THREE.Group(); scene.add(arcGroup);
    buildTrack();   // offline camera track -- see buildTrack() for why offline

    // ⭐ AFTERGLOW. When a ball lands, the NOTEHEAD ITSELF lights and cools, so
    // the road behind the light carries a trail of recently-played notes still
    // warm. This is most of why the reference is pleasant to watch: it makes
    // the PAST visible instead of leaving darkness behind the playhead.
    // A fixed pool, reused by index, so no allocation happens per frame.
    // ⛔ THE SPRITE POOL IS RETIRED. It was a camera-facing billboard hovering
    // ABOVE a painted dot, which is precisely what the user described: "the
    // circle of the note should glow, not just part of some cloud covering the
    // note". The glow is now the notehead's OWN disk, emissive, through the
    // bloom pass -- see strikePool in buildSheet(). glowGroup survives as an
    // empty group only so paperOnly's visibility handling stays one shape.
    glowGroup = new THREE.Group(); scene.add(glowGroup);

    comp = new EffectComposer(R);
    comp.addPass(new RenderPass(scene, cam));
    const bloom = new UnrealBloomPass(new THREE.Vector2(W, H),
      // ⚠ THRESHOLD 0.45 BLOOMED THE PAPER ITSELF and the lower half became
      // fog. Only the cores and the arcs should cross the threshold; the lit
      // sheet must stay under it.
      P.look.bloomStrength ?? 1.05, P.look.bloomRadius ?? 0.60, P.look.bloomThreshold ?? 0.82);
    bloomPass = bloom;
    comp.addPass(bloom);
    grade = new ShaderPass(GRADE);
    grade.uniforms.uVig.value = P.look.vignette ?? 1.0;
    comp.addPass(grade);
    comp.addPass(new OutputPass());
    document.getElementById('ttl').textContent = P.title;
    document.getElementById('sub').textContent = P.subtitle;
    window.__ready = true;
  } catch (e) { window.__err = String(e && e.stack || e); }
};

// ---- per-frame ------------------------------------------------------------
// ⭐ HOLD, THEN HOP — and the CAMERA AND THE LIGHT MUST USE THE SAME CURVE.
// h**2.6 over the whole gap looked right on eighth notes and broke on a
// two-second chord: the camera kept creeping toward the NEXT onset while the
// light stayed on the note it was lit for, so the 2.3-unit camera distance
// collapsed to 0.8 and four cores ballooned at the bottom of the frame.
// Measured on the 11.1 s frame of the finished file. The hop is now a bounded
// window at the END of the gap, so a long note holds the shot steady.
const HOPMAX = 0.55;

// ⭐⭐ ONE CONSTANT GRAVITY, AND THE HEIGHT FALLS OUT OF THE GAP.
// The road is a timeline, so horizontal speed is constant BY CONSTRUCTION
// (z = -t*zps and the flight is linear in t). Under a single constant g a hop
// that must stay airborne for `gap` seconds rises to exactly g*gap^2/8:
//     y(u) = (g*gap^2/2) * u * (1-u),  u = (t-t0)/(t1-t0),  peak g*gap^2/8
// so a long gap arcs high and hangs, and sixteenth notes skip low and fast.
// ⚠ NOTHING IS CLAMPED AND NOTHING IS SPECIAL-CASED -- the variation IS the
// effect. If the tallest arc leaves the frame that is a CAMERA problem, not a
// reason to squash the physics back into a range.
// This replaces a height driven by the pitch LEAP, which had the ball jumping
// high on a wide interval played fast -- the opposite of ballistic.
// ⛔ THE g*gap^2/8 PROPORTIONAL RULE IS WITHDRAWN -- it was my inference, and
// both the user and the footage say otherwise: "pull it low but speed should be
// constant, only bounce is fast as it gets energy to fly". In the reference the
// arcs are SHORT and LOW, a couple of note-widths across and about one staff
// height tall, and they do NOT grow dramatically with the gap.
// So: a tunable CONSTANT height with only MILD gap scaling. Both knobs laddered.
// ⭐ LAST INDEX WHOSE NOTE HAS ALREADY STARTED, in O(log n). Same predicate and
// same tie-break as the linear scan it replaces; -1 when none has.
function notesIdxAt(ns, t) {
  const tt = t + 1e-6;
  let lo = 0, hi = ns.length - 1, r = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1;
    if (ns[m].t <= tt) { r = m; lo = m + 1; } else hi = m - 1; }
  return r;
}

// ⭐ SAME SEARCH OVER A BARE NUMBER ARRAY (the onset clock). Last index whose
// value is <= t; -1 when none. Identical to the linear `for k ... if (uniq[k]
// <= t+1e-6) gi = k` it replaces PROVIDED uniq is ascending, which clockData()
// asserts rather than assumes.
function idxAtNum(a, t) {
  const tt = t + 1e-6;
  let lo = 0, hi = a.length - 1, r = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1;
    if (a[m] <= tt) { r = m; lo = m + 1; } else hi = m - 1; }
  return r;
}

// ⭐⭐ THE THIRD AND FOURTH O(N) PER-FRAME WALKS, HOISTED. __frame rebuilt the
// onset clock AND an N-entry Map of onset-time -> mean x on EVERY FRAME. Both
// are pure functions of the PAYLOAD, which does not change between frames, so
// at 22x the notes and 22x the frames they were another ~480x of loop work and
// ~one Map allocation of N entries per frame for the garbage collector.
// ⚠ CACHED ON P, AND CLEARED BY __init — an isolation render re-inits with a
// different payload, and a stale clock there would move a camera that must not
// move.
let _clk = null;
function clockData() {
  if (_clk) return _clk;
  const uniq = (P.onsets && P.onsets.length)
    ? P.onsets
    : (() => { const o = P.voices.flatMap(v => v.notes.map(n => n.t)).sort((a,b)=>a-b);
               return o.filter((v,i) => i === 0 || v - o[i-1] > 1e-4); })();
  for (let i = 1; i < uniq.length; i++)
    if (uniq[i] < uniq[i-1])
      throw new Error('onset clock not ascending at ' + i + ': ' + uniq[i-1] + ' > ' + uniq[i]);
  const mx = new Map();
  for (const v of P.voices) for (const n of v.notes) {
    const key = Math.round(n.t * 1e4);
    const e = mx.get(key) || { s: 0, c: 0 }; e.s += n.x; e.c++; mx.set(key, e);
  }
  _clk = { uniq, mx };
  return _clk;
}

const arcPeak = gap =>
  (P.look.arcH ?? 0.16) * (1 + (P.look.arcScale ?? 0.35) * Math.min(gap, 1.5));

// ⭐ AND THE PROFILE IS ASYMMETRIC: a fast snap off the notehead, then a long
// shallow glide down onto the next one. 4u(1-u) is a symmetric parabola and
// reads as a lazy lob; this rises in the first ~18 % of the flight and glides
// for the rest, which is what "only the bounce is fast" describes.
function arcShape(u) {
  const r = P.look.arcRise ?? 0.18;
  return u < r ? Math.sin(u / r * Math.PI / 2)          // quick launch
               : Math.cos((u - r) / (1 - r) * Math.PI / 2); // long glide down
}

// ⛔ UNUSED since round 2 replaced hold-then-hop with constant speed. Kept
// deliberately: it is the curve to come back to if constant speed reads too
// mechanical, and deleting it would lose the tuning that produced HOPMAX.
function hopf(t, t0, t1) {
  const gap = t1 - t0;
  if (gap <= 1e-6) return 0;
  const d = Math.min(0.75 * gap, HOPMAX);
  const p = Math.min(1, Math.max(0, (t - (t1 - d)) / d));
  return p * p * p * (p * (p * 6 - 15) + 10);
}

function camAt(t, zc, fx, keys) {
  // ⭐ THE CAMERA IS PARAMETRISED THE WAY IT IS FRAMED, not by two 3-vectors.
  // eye = (x, height, zc + back), aimed with a pitch and a yaw. That is what
  // makes "put the light at 68 % of frame height" a solvable number instead of
  // a guess, and it is also what a zoom/orbit keyframe wants to interpolate.
  // The first cut interpolated eye/target points and put the light OFF THE
  // BOTTOM OF THE FRAME -- found by looking at the 5.2 s still.
  // ⚠ AT back = 1.10 THE STAFF IS 0.8 UNITS WIDE AT 1.1 UNITS AWAY: a note two
  // staff steps off centre swung to 77 % of the half-frame and the near field
  // whipped. Distance-to-staff-width is now ~2.9, which is roughly what the
  // reference frames show.
  const D = { h: 1.05, back: 2.30, pitch: -14, yaw: 0, x: 0, fov: 42 };
  let k = D;
  const kf = keys || P.camera;
  if (kf && kf.length) {
    let i = 0;
    for (let q = 0; q < kf.length; q++) if (kf[q].t <= t) i = q;
    const j = Math.min(i + 1, kf.length - 1);
    let f = (j === i || kf[j].t <= kf[i].t) ? 0 : (t - kf[i].t) / (kf[j].t - kf[i].t);
    f = Math.min(1, Math.max(0, f)); f = f * f * (3 - 2 * f);
    k = {};
    for (const key of Object.keys(D)) {
      const a = kf[i][key] ?? D[key], b = kf[j][key] ?? D[key];
      k[key] = a + (b - a) * f;
    }
  }
  // ⭐ ROUND 10: a look-driven lateral offset for the KEYFRAME camera, so the
  // portrait cut can be laddered sideways without editing three keyframes per
  // rung. ⚠ x AND yaw MOVE TOGETHER: sliding right without re-aiming points the
  // camera off the road, which is exactly the failure roadpix caught on the
  // first short camera (8 of 21 road bands entirely off screen). camYawAdd is
  // therefore not optional decoration -- it is the other half of camXAdd.
  const dx = P.look.camXAdd ?? 0, dyaw = P.look.camYawAdd ?? 0;
  const pr = k.pitch * Math.PI / 180, yr = (k.yaw + dyaw) * Math.PI / 180;
  cam.fov = k.fov; cam.updateProjectionMatrix();
  cam.position.set(k.x + dx + (fx || 0), k.h, zc + k.back);
  const dir = new THREE.Vector3(Math.sin(yr) * Math.cos(pr), Math.sin(pr), -Math.cos(yr) * Math.cos(pr));
  cam.lookAt(cam.position.clone().addScaledVector(dir, 4.0));
}

// ⛔ arcFor() IS GONE. It built the trail from PER-NOTE ARCS and was replaced
// wholesale rather than left beside its successor: two trail systems in one
// file is how the ball and its tail drifted apart in the first place.
function cometFor(c, col) {
  // clip to in front of the lens, by depth along the view direction (the
  // reverse angle broke the raw-z form of this in round 5b)
  const fwd = cam.getWorldDirection(new THREE.Vector3());
  const vis = c.pts.filter(q => q.p.clone().sub(cam.position).dot(fwd) > 0.25);
  if (vis.length < 3) return null;
  const curve = new THREE.CatmullRomCurve3(vis.map(q => q.p));
  const N = vis.length - 1, RS = P.look.cometRing ?? 7;
  // ⭐ THE HEAD IS THE DISK'S OWN RADIUS. The user asked for the tail to come
  // out of the disk AT DISK SIZE; the old fixed arcR 0.011 was unrelated to
  // playR and read as a thread leaving a ball.
  const headR = (P.look.playR ?? (P.NOTE_R * 0.80)) * (P.look.cometHeadK ?? 1.0);
  const geo = new THREE.TubeGeometry(curve, N, headR, RS, false);
  const pos = geo.attributes.position;
  const cols = new Float32Array((N + 1) * (RS + 1) * 4);
  const tint = new THREE.Color(col);
  const wp = P.look.cometWidthPow ?? 1.30, ap = P.look.cometAlphaPow ?? 1.70;
  const gain = (P.look.cometGain ?? 1.05) * (c.envK ?? 1);
  for (let i = 0; i <= N; i++) {
    // u = 0 at the head (the ball), 1 at the oldest sample
    // ⭐ TWO CLAIMS ON u, AND THE TAPER TAKES THE STRONGER. Age alone left a
    // young comet at 78 % width after 0.2 s, so its final ring was a FLAT
    // FULL-WIDTH CAP wherever the ribbon happened to end -- in mid-air during a
    // spawn, or at the camera-clip boundary. Taking the max with the ribbon's
    // own normalised INDEX forces w and alpha to exactly 0 at the last sample,
    // whatever its age. "There is no end of the tail" then holds by
    // construction rather than by the ribbon happening to be old enough.
    const uAge = vis[Math.min(i, vis.length - 1)].age / c.maxAge;
    const uIdx = N > 0 ? i / N : 1;
    // ⚠ `cometTaperAgeOnly` RESTORES THE ORIGINAL BUG ON PURPOSE. It is the
    // control for entry.mjs (F): with the age-only taper a newborn ribbon sits
    // at ~78 % width after 0.2 s and presents a flat cap, which is what put
    // 104,596 px into the sky box in r9. A gate whose control cannot fire is
    // not a gate, and this one has already shipped a defect once.
    const u = P.look.cometTaperAgeOnly === true
            ? Math.min(1, Math.max(0, uAge))
            : Math.min(1, Math.max(0, Math.max(uAge, uIdx)));
    const w = Math.pow(1 - u, wp);              // -> EXACTLY 0 at u = 1
    const al = Math.pow(1 - u, ap) * gain;      // -> EXACTLY 0 at u = 1
    const ctr = curve.getPoint(N ? i / N : 0);
    for (let j = 0; j <= RS; j++) {
      const n = i * (RS + 1) + j;
      pos.setXYZ(n, ctr.x + (pos.getX(n) - ctr.x) * w,
                    ctr.y + (pos.getY(n) - ctr.y) * w,
                    ctr.z + (pos.getZ(n) - ctr.z) * w);
      cols[n*4] = tint.r * 1.75; cols[n*4+1] = tint.g * 1.75; cols[n*4+2] = tint.b * 1.75;
      cols[n*4+3] = al;
    }
  }
  pos.needsUpdate = true;
  geo.setAttribute('color', new THREE.BufferAttribute(cols, 4));
  // ⚠ ADDITIVE AND depthWrite:false -- a comet is light, not a surface. This is
  // one of the few places transparency is CORRECT (see the note on materials).
  return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, toneMapped: false, side: THREE.DoubleSide }));
}

// ⭐ LIVE LOOK TUNING. Mutates the SAME objects the film renders through, so a
// value tuned in the preview is the value the film gets -- a preview that
// forks the scene tunes something you do not ship.
window.__setLook = function (partial) {
  Object.assign(P.look, partial || {});
  if (bloomPass) {
    bloomPass.strength  = P.look.bloomStrength  ?? 1.05;
    bloomPass.radius    = P.look.bloomRadius    ?? 0.60;
    bloomPass.threshold = P.look.bloomThreshold ?? 0.82;
  }
  if (overheadLight) overheadLight.intensity = P.look.overhead ?? 0.0;
  if (R) R.toneMappingExposure = P.look.exposure ?? 0.85;
  if (window.__t !== undefined) window.__frame(window.__t);
  return P.look;
};

// ⭐⭐ THE WRONG-ROAD GATE NEEDS AN INSTRUMENT THE SCENE DOES NOT OWN.
// A payload check can prove every note was MAPPED to the right road; it cannot
// prove the right road is what got DRAWN. This projects a road's x-band through
// the LIVE camera at the current frame, so a gate can photograph the film,
// argmax the brightest core, and ask whether that pixel is inside the band its
// own note belongs to. The scene supplies only where it thinks the band is; the
// PNG is the independent witness.
// ⭐ WHERE IS THIS WORLD POINT ON SCREEN, according to the LIVE camera?
// The trail-continuity gate needs the previous notehead's pixel, and computing
// it outside the scene would mean re-implementing camAt -- i.e. checking the
// gate's copy of the camera rather than the film's.
// the lens, readable from outside -- lib/perfcam.mjs needs it to prove the
// two takes really did move the camera before it trusts 'the state matched'.
// a point ON the trail's own path, so lib/roadpix.mjs can sample the ribbon
// instead of the notehead it ends at. ⛔ IT USED TO SAMPLE THE NOTEHEAD ITSELF
// and round 5 broke that: the struck note's residual emissive (TERM 2) now
// saturates that pixel to 1.0 with the trail on AND off, so the differential
// read 0.000 and the gate called a perfectly good trail missing. Sampling just
// off the head measures TERM 3, the ribbon, which is what it is asking about.
window.__arcPt = function (x0, t0, x1, t1, s) {
  const g = t1 - t0;
  const v = new THREE.Vector3(x0 + (x1 - x0) * s, 0.03 + arcPeak(g) * arcShape(s),
                              -((t0 + g * s) * P.zps));
  return { x: v.x, y: v.y, z: v.z };
};
